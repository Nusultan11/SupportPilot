# Gold benchmark source, part 5: multi-turn dialogues (context carried across turns), more
# tool cases, and harder grounded questions (typos, slang, code-switching, two-part
# questions). Authored separately from training by the Stage 4 agent (LLM); review `draft`.
schema_version: gold_src/1
items:
  # --- multi-turn: the last user turn depends on the earlier turns
  - id: mt_track_id_later
    cat: multi_turn
    diff: medium
    intent: track_order
    action: call_tool
    tool: {get_order: {order_id: "583302", status: in_transit, carrier: Kazpost, eta: "2026-11-18"}}
    facts: {eta: "2026-11-18"}
    en: ["hi, my parcel is late", "Sorry to hear that. Could you send me the six-digit order number?", "583302"]
    ru: ["здравствуйте, посылка задерживается", "Сожалею. Пришлите, пожалуйста, шестизначный номер заказа.", "583302"]
    kk: ["сәлеметсіз бе, сәлемдемем кешігіп жатыр", "Өкінішті. Алты таңбалы тапсырыс нөмірін жіберіңізші.", "583302"]
  - id: mt_track_then_eta
    cat: multi_turn
    diff: medium
    intent: track_order
    action: call_tool
    tool: {get_order: {order_id: "771845", status: in_transit, carrier: CDEK, eta: "2026-11-14"}}
    facts: {eta: "2026-11-14"}
    en: ["I want to ask about order 771845", "Of course. What would you like to know about it?", "will it be here before the weekend?"]
    ru: ["хочу спросить про заказ 771845", "Конечно. Что именно вас интересует?", "успеет до выходных?"]
    kk: ["771845 тапсырысы туралы сұрағым бар", "Әрине. Нақты не білгіңіз келеді?", "демалысқа дейін келіп үлгере ме?"]
  - id: mt_cancel_after_track
    cat: multi_turn
    diff: hard
    intent: cancel_order
    action: call_tool
    tool: {request_cancellation: {order_id: "308826", accepted: true, ticket_id: "CN-61930"}}
    facts: {ticket_id: "CN-61930"}
    en: ["what's the status of 308826?", "Order 308826 is being prepared and has not shipped yet.", "ok then cancel it please"]
    ru: ["какой статус у 308826?", "Заказ 308826 собирается и ещё не отправлен.", "тогда отмените его, пожалуйста"]
    kk: ["308826 тапсырысының күйі қандай?", "308826 тапсырысы жиналып жатыр, әлі жөнелтілген жоқ.", "онда оны болдырмаңызшы"]
  - id: mt_return_then_cost
    cat: multi_turn
    diff: medium
    intent: return_product
    action: answer_kb
    ev: [returns_policy.how_to_return]
    facts: {return_shipping_cost: "1000"}
    en: ["can I return a kettle?", "Yes, items can be returned within the return period if they are unused and in the original packaging.", "and do I pay for sending it back?"]
    ru: ["можно вернуть чайник?", "Да, товар можно вернуть в срок возврата, если он не использовался и в оригинальной упаковке.", "а за отправку обратно я плачу?"]
    kk: ["шәйнекті қайтаруға бола ма?", "Иә, тауар пайдаланылмаған және түпнұсқа қаптамасында болса, қайтару мерзімі ішінде қайтаруға болады.", "ал кері жіберу үшін мен төлеймін бе?"]
  - id: mt_delivery_city_switch
    cat: multi_turn
    diff: hard
    intent: delivery_time
    action: answer_kb
    ev: [delivery_policy.periods]
    facts: {region_delivery_days: "3-6"}
    en: ["how long to Astana?", "Delivery to Almaty and Astana takes 2–3 days after the order ships.", "and what if I send it to my brother in Taraz instead?"]
    ru: ["сколько до Астаны?", "Доставка в Алматы и Астану занимает 2–3 дня после отправки.", "а если отправить брату в Тараз?"]
    kk: ["Астанаға дейін қанша уақыт?", "Алматы мен Астанаға жеткізу жөнелтілгеннен кейін 2–3 күн алады.", "ал Таразда тұратын ініме жіберсем ше?"]
  - id: mt_pay_then_instalment
    cat: multi_turn
    diff: medium
    intent: payment_methods
    action: answer_kb
    ev: [payment_policy.instalments]
    facts: {instalment_months: "12"}
    en: ["do you take Kaspi?", "Yes, Kaspi QR and Kaspi Red are accepted.", "can I spread a 300k phone over a year then?"]
    ru: ["Kaspi принимаете?", "Да, принимаем Kaspi QR и Kaspi Red.", "тогда телефон за 300 тысяч можно растянуть на год?"]
    kk: ["Kaspi қабылдайсыздар ма?", "Иә, Kaspi QR мен Kaspi Red қабылданады.", "онда 300 мыңдық телефонды бір жылға бөліп төлеуге бола ма?"]
  - id: mt_refund_status_carry
    cat: multi_turn
    diff: hard
    intent: refund_status
    action: call_tool
    tool: {get_payment: {order_id: "419957", status: paid, refund: {status: processing, amount_kzt: 21400, started_at: "2026-11-09", expected_by: "2026-11-23"}}}
    facts: {expected_by: "2026-11-23"}
    en: ["I returned the boots from order 419957", "Thank you. Once the returned item has been checked, the money is sent back to your payment method.", "so when exactly will the money be back?"]
    ru: ["я вернула ботинки из заказа 419957", "Спасибо. После проверки возвращённого товара деньги отправят тем же способом оплаты.", "так когда именно деньги вернутся?"]
    kk: ["419957 тапсырысындағы бәтеңкені қайтардым", "Рақмет. Қайтарылған тауар тексерілген соң, ақша төлем тәсіліңізге қайтарылады.", "сонда ақша нақты қашан қайтады?"]
  - id: mt_clarify_product_then_stock
    cat: multi_turn
    diff: medium
    intent: availability
    action: call_tool
    tool: {get_stock: {sku: HD-0909, in_stock: true, qty: 12, warehouse_city: Almaty}}
    facts: {qty: "12"}
    en: ["is it in stock?", "Which product do you mean? A name or SKU is enough.", "the hair dryer HD-0909"]
    ru: ["есть в наличии?", "Какой именно товар? Достаточно названия или артикула.", "фен с артикулом HD-0909"]
    kk: ["қоймада бар ма?", "Қай тауар туралы айтып тұрсыз? Атауы немесе артикулы жеткілікті.", "HD-0909 шаш кептіргіш"]
  - id: mt_human_after_bot
    cat: multi_turn
    diff: medium
    intent: human_agent
    action: escalate
    esc: customer_requested_human
    en: ["my discount wasn't applied", "One promo code can be used per order and it does not combine with other discounts.", "I don't care, I want to speak to a person"]
    ru: ["мне не применили скидку", "В одном заказе можно применить один промокод, он не суммируется с другими скидками.", "мне всё равно, хочу поговорить с человеком"]
    kk: ["маған жеңілдік қолданылмады", "Бір тапсырысқа бір промокод қолданылады және ол басқа жеңілдіктермен қосылмайды.", "маған бәрібір, адаммен сөйлескім келеді"]
  - id: mt_defect_escalate_safety
    cat: multi_turn
    diff: hard
    intent: product_defect
    action: escalate
    esc: safety_risk
    en: ["the microwave from my last order makes a buzzing noise", "Sorry about that. Could you send me the order number?", "now it's sparking inside and smells burnt"]
    ru: ["микроволновка из последнего заказа гудит", "Сожалеем. Пришлите, пожалуйста, номер заказа.", "теперь внутри искрит и пахнет гарью"]
    kk: ["соңғы тапсырыстағы микротолқынды пеш ызыңдап тұр", "Кешірім сұраймыз. Тапсырыс нөмірін жіберіңізші.", "енді ішінде ұшқын шашып, күйік иісі шығып тұр"]
  - id: mt_cs_track
    cat: multi_turn
    diff: hard
    intent: track_order
    action: call_tool
    cs: [kk, ru]
    tool: {get_order: {order_id: "690273", status: at_pickup_point, keep_until: "2026-11-16"}}
    facts: {keep_until: "2026-11-16"}
    en: ["hello, got an sms but not sure about it", "Hello! Which order is the SMS about? Please send the order number.", "690273, can I pick it up?"]
    ru: ["здравствуйте, смс пришла, бірақ түсінбедім", "Здравствуйте! По какому заказу пришло SMS? Пришлите номер заказа.", "690273, забрать можно уже?"]
    kk: ["сәлеметсіз бе, смс келді, но не поняла", "Сәлеметсіз бе! SMS қай тапсырыс бойынша келді? Тапсырыс нөмірін жіберіңіз.", "690273, забрать етуге бола ма?"]
  - id: mt_account_delete_confirm
    cat: multi_turn
    diff: medium
    intent: account_help
    action: answer_kb
    ev: [account_faq.delete]
    facts: {account_delete_days: "10"}
    en: ["I don't want to use your store anymore", "I'm sorry to hear that. Is there something I can help you with, or would you like to close your account?", "close it. how long until it's gone?"]
    ru: ["я больше не хочу пользоваться вашим магазином", "Жаль это слышать. Могу чем-то помочь или вы хотите удалить аккаунт?", "удалить. через сколько он исчезнет?"]
    kk: ["енді дүкендеріңізді пайдаланғым келмейді", "Өкінішті. Немен көмектесе аламын, әлде аккаунтыңызды жапқыңыз келе ме?", "жабыңыз. қашан жойылады?"]
  - id: mt_exchange_size_followup
    cat: multi_turn
    diff: medium
    intent: exchange_product
    action: answer_kb
    ev: [returns_policy.exchange]
    facts: {exchange_window_days: "21"}
    en: ["the dress doesn't fit", "Sorry about that! Would you like to return it or exchange it for another size?", "exchange. how long do I have?"]
    ru: ["платье не подошло", "Жаль! Хотите вернуть его или обменять на другой размер?", "обменять. сколько у меня времени?"]
    kk: ["көйлек шақ келмеді", "Өкінішті! Оны қайтарғыңыз келе ме, әлде басқа өлшемге айырбастағыңыз келе ме?", "айырбастаймын. қанша уақытым бар?"]
  - id: mt_oos_after_order
    cat: multi_turn
    diff: medium
    intent: out_of_scope
    action: refuse_oos
    en: ["thanks for the tracking info", "You're welcome! Is there anything else I can help with?", "yes, which bank gives the best deposit rate?"]
    ru: ["спасибо за информацию по заказу", "Пожалуйста! Чем ещё могу помочь?", "да, в каком банке лучший процент по депозиту?"]
    kk: ["тапсырыс туралы ақпарат үшін рақмет", "Оқасы жоқ! Тағы немен көмектесейін?", "иә, қай банкте депозит пайызы ең жоғары?"]
