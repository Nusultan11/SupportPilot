  bitext_retail_ecom:
    summary: 'Requests are short, on-topic retail support messages and the intent label matches the text
      in most rows. The variety is synthetic: about half of the rows have a swear word inserted mechanically
      into an otherwise neutral template ("report a fucking damaged product"), and typos are injected
      on purpose (tag Z). Label noise is systematic, not random: 265 of 994 return_product_in_store rows
      are product-information requests with no return wording (now pending as label_suspect), and in-store
      / online / policy variants of returns and track_order / track_delivery share identical texts. Responses
      are long generic how-to texts with unresolved store facts ({{Customer Support Phone Number}}) and,
      in profane variants, prompt leaks such as "offensive language used in your instruction" or apologies
      for a "previous response" that does not exist.'
    verdict: Usable as the EN intent backbone for the 38 mapped source intents after the Stage 3 cleaning.
      Not usable as a source of response text or facts. Real diversity is 46 scenarios (37 in the canonical
      set); the 44,884 rows are paraphrase variation of them.
    recommendation: Use customer texts and labels (canonical set), cap rows per paraphrase family, and
      keep a controlled share of the profane variants (they are 49% of rows, far above a realistic rate).
      Do not train on reference responses; build targets from the training KB variant. Resolve the open
      taxonomy decisions (customer_service, technical_issue, cart, pay) and review the conflicting return
      / tracking variants before freezing the v1 map.
