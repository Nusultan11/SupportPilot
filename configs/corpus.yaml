# Stage 1 corpus recipe (ADR-047, DATA_CONTRACTS §6-9). Validated by
# `supportpilot.data.recipe.Recipe` against taxonomy v1 and the source registry.
#
# A label is an authored mapping of the SOURCE's own label (scenario prompt, intent class)
# to a v1 intent. It is never independent human adjudication (human_review: NOT_EVALUATED).
#   intent: X            -> mapped_direct: the source label alone fixes the intent
#   rules: [{cue, ...}]  -> mapped_cue: first rule whose cue (case-insensitive regex) is found
#                           in the text; no cue found -> `unverified` pool (candidate intent)
#   exclude: reason      -> the row is excluded with this reason
#   veto: [{pattern, reason}] -> excluded when the pattern is found (checked first)
# Texts shorter than `min_words` never enter the core pool.
schema_version: corpus_recipe/1
seed: 20261117
split: {train: 0.8, validation: 0.1, test: 0.1}
neardup: {shingle: 4, jaccard: 0.7, num_perm: 64, bands: 16}
min_words: 3
max_chars: 1000
review_sample_per_language: 100

sources:
  # ---------------------------------------------------------------- EN retail support chats
  abcd:
    domain: retail_support
    origin: {en: human_roleplay}
    evidence: >-
      Chen et al. 2021 (NAACL, arXiv:2104.00783 §3): crowd workers role-played customers from
      a scenario prompt with trained agents in live chat (Expert Live Chat, 2020); no text
      generator. The opening customer request is taken; the subflow is the prompt the customer
      received.
    named_product: '\b(?:calvin[ _]?klein|ck|guess|michael[ _]?kors|tommy[ _]?hilfiger|hilfiger)\b'
    labels:
      # account_access
      recover_username: &account_access
        rules:
          - {cue: '\b(?:passw\w*|pass word|user ?name|user id|log ?in|login|logging|sign(?:ing)? ?in|locked|access|2fa|two[- ]?(?:step|factor)|authent\w*|verification|get (?:in|into|back)|forg[eo]t\w*)\b|\blost (?:my |the )?phone\b|\bphone (?:i|that i) used\b', intent: account_help}
      recover_password: *account_access
      reset_2fa: *account_access
      # manage_account
      manage_change_name:
        rules: [{cue: '\bname\b', intent: account_help}]
      manage_change_phone:
        rules: [{cue: '\bphone|number\b', intent: account_help}]
      manage_change_address:  # account-management flow: the address on file is a profile address
        rules:
          - {cue: '^(?=.*\baddress).*\b(?:order\w*|package|parcel|shipment|delivery|deliver\w*|ship\w*)\b', intent: change_address}
          - {cue: '\baddress\b', intent: account_help}
      manage_payment_method:
        rules: [{cue: '\b(?:account|primary|profile|default)\b', intent: account_help}]
      status_shipping_question:  # "I have a shipping question" alone does not state the question
        rules:
          - {cue: '^(?=.*\b(?:shipping|ship|delivery)\b).*\b(?:free|international\w*|overseas|abroad|countr(?:y|ies)|fees?|cost\w*|price|expedite\w*|fast|options?|types?|benefits?|waived?)\b', intent: delivery_options_cost}
      status_service_added: &no_v1 {exclude: "premium-subscription service: no v1 intent"}
      status_service_removed: *no_v1
      status_credit_missing: {exclude: "promotional store credit of a subscription: no v1 intent"}
      # order_issue
      status_mystery_fee:
        rules: [{cue: '\b(?:fee|charged?|bill\w*)\b', intent: payment_problem}]
      status_delivery_time: &delivery_status
        rules:
          - {cue: '\b(?:change|reschedul\w*|extend)\b', intent: change_order}
          - {cue: '\b(?:status|when|where|arriv\w*|deliver\w*)\b', intent: track_order}
      status_delivery_date: *delivery_status
      status_payment_method:
        rules:
          - {cue: '\b(?:change|update|switch|correct|fix)\b', intent: change_order}
          - {cue: '\b(?:payment|paypal|credit card|paid)\b', intent: payment_problem}
      status_quantity:
        rules: [{cue: '\b(?:quantity|two|2|twice|extra|one|only ordered|double)\b', intent: change_order}]
      manage_upgrade: &shipping_change
        rules: [{cue: '\b(?:ship\w*|deliver\w*|overnight|express|expedite\w*|faster|next week)\b', intent: change_order}]
      manage_downgrade: *shipping_change
      manage_create:
        rules: [{cue: '\badd\w*\b', intent: change_order}]
      manage_cancel:
        veto: [{pattern: '\breturn', reason: "source label (remove before shipping) contradicts a return request"}]
        rules: [{cue: '\b(?:remove|take (?:it )?off|cancel\w*|delete|take out)\b', intent: change_order}]
      # product_defect
      refund_initiate:
        rules:
          # money back before the item ships is a cancellation of the placed order (taxonomy v1)
          - {cue: '\bbefore (?:\w+ ){0,3}ships?\b|\b(?:hasn''?t|has not|not) (?:yet )?(?:been )?shipped\b|\bshipped yet\b|\bstop the order\b|\bcancel\w*', intent: cancel_order}
          - {cue: '\b(?:refund|money back)\b', intent: request_refund}
          - {cue: '\breturn\w*\b', intent: return_product}
      refund_update:
        rules:
          - {cue: '\b(?:status|where|state|update|yet|pending|check|owed|haven''?t)\b', intent: refund_status}
      refund_status:
        rules: [{cue: '\brefund\w*\b', intent: refund_status}]
      return_size: &return_item
        rules:
          - {cue: '\b(?:sent|received|got|gave) (?:me )?(?:the |a |an )?wrong\b|\bwas sent\b', intent: delivery_problem}
          - {cue: '\bexchange\w*\b', intent: exchange_product}
          - {cue: '\breturn\w*\b', intent: return_product}
      return_color: *return_item
      return_stain:  # an item damaged on arrival is a delivery problem (taxonomy v1)
        rules:
          - {cue: '\b(?:stain\w*|dirty|damaged?|spot)\b', intent: delivery_problem}
          - {cue: '\breturn\w*\b', intent: return_product}
      # purchase_dispute
      bad_price_competitor: {exclude: "price-match request: no v1 intent; needs another store's prices"}
      bad_price_yesterday: {exclude: "price-adjustment request: no v1 intent"}
      out_of_stock_general:
        rules: [{cue: '\b(?:frustrat\w*|upset|annoy\w*|ridiculous|always|every ?time|never|why should i|complain\w*)\b', intent: complaint}]
      out_of_stock_one_item:
        veto: [{pattern: '\b(?:complain\w*|frustrat\w*|upset)\b', reason: "stock-out with a complaint: availability and complaint both fit"}]
        rules: [{cue: '\b(?:out of stock|in stock|available|availability|restock\w*|sold out|back in stock)\b', intent: availability}]
      promo_code_invalid: &promo
        rules: [{cue: '\b(?:promo\w*|code|coupon|discount)\b', intent: policy_faq}]
      promo_code_out_of_date: *promo
      mistimed_billing_already_returned:
        # the money side must be stated: "an issue with a return" alone does not fix the intent
        rules: [{cue: '\b(?:refund\w*|revers\w*|reveres\w*|money|credit\w*|charges?|bill\w*)\b', intent: refund_status}]
      mistimed_billing_never_bought:
        rules:
          - {cue: '\b(?:never|didn''?t|did not|not) (?:bought|buy|placed|place|made|ordered|order)\b', intent: payment_problem, action: escalate, escalation_reason: payment_dispute}
      # shipping_issue
      status: {exclude: "order e-mail discrepancies of several kinds: no single v1 intent"}
      manage:
        rules:
          - {cue: '\b(?:address|moved?|moving|where (?:my|the) package)\b', intent: change_address}
          - {cue: '\b(?:change|stop)\b', intent: change_order}
      missing:
        rules:
          - {cue: '\b(?:never|not|haven''?t|hasn''?t|didn''?t|still)\b[\w\s]{0,20}\b(?:receiv\w*|get|got|gotten|arriv\w*|come|came|deliver\w*|shown up|show up)\b|\bmissing\b', intent: delivery_problem}
          - {cue: '\b(?:status|where|shipped|track\w*)\b', intent: track_order}
      cost:  # shipping charge complaints mix cost questions, refunds and cancellations
        candidate: delivery_options_cost
      # single_item_query (numeric suffixes removed by the reader)
      boots_how: &product_query
        veto: [{pattern: '\b(?:cheaper|expensive|overpriced|price (?:drop|went|change)|competitor)\b', reason: "price complaint inside a product question"}]
        rules:
          - {cue: '\b(?:in stock|(?:un)?available|availability|sold out|in (?:a )?(?:smaller|bigger|larger|different) size|any in)\b', intent: availability}
          - {cue: '\bwarrant\w*\b', intent: policy_faq}
          - {cue: '\b(?:boots?|shoes?|jackets?|coats?|hood|jeans?|pants|denim|shirts?|t-shirt|collar|material|wash\w*|size|waterproof|shrink\w*|made of|fabric)\b', intent: product_info}
      boots_other: *product_query
      jacket_how: *product_query
      jacket_other: *product_query
      jeans_how: *product_query
      jeans_other: *product_query
      shirt_how: *product_query
      shirt_other: *product_query
      # storewide_query
      membership:
        rules: [{cue: '\b(?:member\w*|premium|level|tier|gold|silver|bronze)\b', intent: policy_faq}]
      policy:
        veto: [{pattern: '\bsubscription\b', reason: "premium-subscription service: no v1 intent"}]
        rules:
          - {cue: '\b(?:return|refund|exchange)s?\b', intent: return_policy}
          - {cue: '\b(?:polic\w*|rules?|warrant\w*)\b', intent: policy_faq}
      pricing:
        rules:
          - {cue: '\b(?:shipping|delivery|deliver|overnight)\b', intent: delivery_options_cost}
          - {cue: '\b(?:gift ?wrap\w*|wrapping|monogram\w*|stitch\w*|embroider\w*|personaliz\w*)\b', intent: policy_faq}
      timing:
        rules:
          - {cue: '\b(?:promo\w*|code|coupon)\b', intent: policy_faq}
          - {cue: '\b(?:open\w*|clos\w*|hours|sale|season|collection|release\w*|come out|drop)\b', intent: store_info}
      # subscription_inquiry
      status_active: *no_v1
      status_due_amount: *no_v1
      status_due_date: *no_v1
      status_questions: *no_v1
      manage_pay_bill: *no_v1
      manage_extension: *no_v1
      manage_dispute_bill: {exclude: "subscription bill dispute; double charges for orders are not separable from the subscription case"}
      # troubleshoot_site
      credit_card:
        rules: [{cue: '\b(?:card|declin\w*|reject\w*|payment|pay)\b', intent: payment_problem}]
      shopping_cart: &site_problem
        rules: [{cue: '\b(?:cart|basket|button|website|site|page|search\w*|results?|load\w*|spinning|wheel|slow\w*|lag\w*|speed|working|work)\b', intent: technical_issue}]
      search_results: *site_problem
      slow_speed: *site_problem

  # ---------------------------------------------------------------- EN/RU virtual-assistant requests
  massive_en_ru:
    domain: virtual_assistant
    origin: {en: human_written, ru: human_localised}
    evidence: >-
      FitzGerald et al. 2022 (arXiv:2204.08582 §3): EN utterances written by crowd workers;
      RU localised by professional translators and validated by workers. EN and RU rows of one
      id are one parallel family (same split).
    veto:
      - {pattern: '\bolly\b|\bолли\b', reason: "addressed to the voice assistant by its wake word"}
      - &shopping_veto {pattern: '\b(?:shop\w*|store|order\w*|deliver\w*|buy\w*|purchas\w*|магазин\w*|заказ\w*|доставк\w*|куп\w*|покуп\w*)\b', reason: "mentions shopping: out_of_scope is not certain"}
    labels:
      general_greet:
        veto: [&who_veto {pattern: '\bwho are you\b|\bты кто\b|\bкто ты\b', reason: "question about the assistant; no v1 intent"}]
        intent: greeting
        min_words: 1
      general_quirky: {exclude: "catch-all class with mixed requests"}
      lists_createoradd: &shopping_like {exclude: "lists/takeaway/e-mail/social intents overlap shopping or complaints"}
      lists_query: *shopping_like
      lists_remove: *shopping_like
      takeaway_order: *shopping_like
      takeaway_query: *shopping_like
      email_addcontact: *shopping_like
