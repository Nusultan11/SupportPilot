      iot_wemo_on: *oos
      music_dislikeness: *oos
      music_likeness: *oos
      music_query: *oos
      music_settings: *oos
      news_query: *oos
      play_audiobook: *oos
      play_game: *oos
      play_music: *oos
      play_podcasts: *oos
      play_radio: *oos
      qa_currency: *oos
      qa_definition: *oos
      qa_factoid: *oos
