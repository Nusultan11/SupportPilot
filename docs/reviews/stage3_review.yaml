conclusions: '**Volume vs diversity.** The 99,882 records hold 95,000+ distinct texts, but the two

  Bitext sources (71,756 rows) reduce to 68 scenarios (same request and required action),

  and the canonical set of 55,648 rows to 55 scenarios across 23 v0 intents.

  support-json-ru has 26 policy situations and Belebele 789 passage groups (not support).

  while-ai is lexically diverse (24,520 near-unique dialogues) but about half off-domain and

  labelled per dialogue, so it adds no canonical scenarios yet.


  **What Stage 4 can rely on.** The canonical set (EN, Bitext, mapped draft-v0 labels) is

  clean by every automatic gate, but it is a paraphrase-heavy set of a few dozen scenarios.

  Paraphrase families (J ≥ 0.8) are compact, yet lower thresholds chain whole intents

  together. A validation/test split drawn from Bitext therefore measures robustness to

  paraphrase, not generalisation to new requests. Generalisation must be measured on the

  independently authored gold benchmark and on scenario-disjoint data.


  **Main risks.** (1) No RU/KK support data; Stage 4 must create it, and Kazakh translation

  quality needs human review (Belebele KK already shows calques and typos). (2) Templated,

  over-profane EN register. (3) Draft-v0 labels: 11 source intents remain unmapped and

  several Bitext labels conflict; actions come from rules (needs_reference) and are draft.

  (4) Reference responses contain unresolved store facts and generation artefacts and must

  not become training targets.


  **Limitations of this review.** One reviewer, an LLM agent, read 100 random and up to 100

  flagged records per source (Belebele had only 24 flagged). This is not an independent

  human review; codes are judgments on truncated displays (text ≤ 170 chars, response

  ≤ 100 chars). Kazakh and Russian quality needs a fluent human reviewer.

  '
