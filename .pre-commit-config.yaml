# Install once per clone: `uv run pre-commit install`
# Run on everything:      `uv run pre-commit run --all-files`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]   # AGENTS.md §8: nothing > 5 MB in git
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict, src)
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-fast
        name: pytest (not slow / gpu / qdrant_server)
        entry: uv run --frozen pytest -q -m "not slow and not gpu and not qdrant_server"
        language: system
        types: [python]
        pass_filenames: false
