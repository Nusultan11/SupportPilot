# Source registry (DATA_CONTRACTS §2, ADR-006, ADR-018). Validated by `SourceRegistry`.
# Every source that was investigated is listed, including rejected ones and the reason.
# status:      selected | candidate | rejected | unavailable
# allowed_use: train | eval_only | reference_only | blocked  (capped by the licence policy)
# Revisions are full HF commit shas; `include` limits which repo files are downloaded.
schema_version: sources/1
sources:

  # ------------------------------------------------------------------ selected (acquired)
  - source_id: bitext_retail_ecom
    url: https://huggingface.co/datasets/bitext/Bitext-retail-ecommerce-llm-chatbot-training-dataset
    revision: 12dd624ddcd3057382b2faad661bcda1fa869491
    licence: cdla-sharing-1.0
    licence_evidence: "HF card metadata `license: cdla-sharing-1.0` (checked 2026-11-11)"
    allowed_use: train
    status: selected
    languages: [en]
    size: {rows: 44884, files: 2, bytes: 42634113}
    reviewed_at: 2026-11-11
    purpose: EN scenario backbone for retail/e-commerce intents (46 intents, 13 categories)
    decision: >-
      Closest licensed match to the product scope (orders, delivery, returns, payment,
      products, store). Hybrid-synthetic and templated: rows are paraphrase families of few
      scenarios, so unique-scenario count is measured in Stage 3.
    notes: >-
      Responses contain {{Placeholder}} slots. Tags column = Bitext register/style codes.
      CDLA-Sharing: published derived data must keep the same licence.
    fetch:
      repo_id: bitext/Bitext-retail-ecommerce-llm-chatbot-training-dataset
      include: ["*.csv", "README.md"]

  - source_id: bitext_customer_support
    url: https://huggingface.co/datasets/bitext/Bitext-customer-support-llm-chatbot-training-dataset
    revision: 430d1a89bd93bd1fa23c16f29dd53e73f0087443
    licence: cdla-sharing-1.0
    licence_evidence: "HF card metadata `license: cdla-sharing-1.0` (checked 2026-11-11)"
    allowed_use: train
    status: selected
    languages: [en]
    size: {rows: 26872, files: 2, bytes: 19214423}
    reviewed_at: 2026-11-11
    purpose: EN generic customer-support intents (orders, refunds, invoices, shipping address, account)
    decision: >-
      Complements the retail set with invoice, shipping-address, complaint and account flows.
      Overlaps with retail on cancel/change order and refunds (overlap measured in Stage 3).
    notes: Card text lists fewer intents than the data contains; trust the data (Stage 3).
    fetch:
      repo_id: bitext/Bitext-customer-support-llm-chatbot-training-dataset
      include: ["*.csv", "README.md"]

  - source_id: whileai_ecommerce_intent
    url: https://huggingface.co/datasets/while-ai/ecommerce-intent
    revision: d763946298622bef7ee1900f2aec326803769f81
    licence: cc-by-4.0
    licence_evidence: "HF card metadata `license: cc-by-4.0`; README \"machine-generated\" (checked 2026-11-11)"
    allowed_use: train
    status: selected
    languages: [en]
    size: {files: 3, bytes: 77603737}
    reviewed_at: 2026-11-11
    purpose: >-
      Naturalistic (non-templated) EN multi-turn e-commerce payment/refund/billing conversations
      to counter Bitext's template style; intent labels over 7 payment types.
    decision: >-
      Selected for Stage 3 EDA; inclusion in SFT depends on measured quality. LLM role-play
      simulation, generator models not named, so it is never used as a source of facts.
    notes: Label set (spend/send/exchange/recur/bill/reverse/none) differs from ours; map in Stage 4.
    fetch:
      repo_id: while-ai/ecommerce-intent
      include: ["train.jsonl", "eval.jsonl", "README.md"]

  - source_id: support_json_ru
    url: https://huggingface.co/datasets/A11Sunday/support-json-ru
    revision: 280ce3631b7962c3bcb31df9e61d344f2a691111
    licence: cc-by-4.0
    licence_evidence: LICENSE.txt "Licensed under Creative Commons Attribution 4.0" + card metadata (checked 2026-11-11)
    allowed_use: reference_only
    status: selected
    languages: [ru]
    size: {rows: 716, files: 6, bytes: 4275284}
    reviewed_at: 2026-11-11
    purpose: >-
      RU reference for policy-conditioned support decisions (message + policies + facts ->
      category, action, reply, escalation): informs our grounded SFT design and RU phrasing.
    decision: >-
      SaaS domain, not e-commerce, and synthetic; licence would allow training but we keep it
      reference_only until Stage 4 shows a use. Only the `selected` config is fetched: the
      other configs overlap it (card warning).
    notes: Attribution required (A11Sunday, Support-JSON-RU, 2026); indicate changes when sharing.
    fetch:
      repo_id: A11Sunday/support-json-ru
      include: ["data/selected/*.parquet", "LICENSE.txt", "README.md", "documentation/DATASET.md"]

  - source_id: belebele
    url: https://huggingface.co/datasets/facebook/belebele
    revision: 7899cdfa4e1e0d733fd77c848e2c273cb1d32be2
    licence: cc-by-sa-4.0
    licence_evidence: "HF card metadata `license: cc-by-sa-4.0` (checked 2026-11-11)"
    allowed_use: eval_only
    status: selected
    languages: [kk, ru, en]
    size: {rows: 2700, files: 4, bytes: 7803342}
    reviewed_at: 2026-11-11
    purpose: Parallel reading-comprehension benchmark to measure base-model KK/RU/EN competence (Stage 7)
    decision: >-
      Public, parallel across our three languages, standard for KK model comparison. The card
      says test-only, so eval_only (never training or tuning).
    fetch:
      repo_id: facebook/belebele
      include: ["data/kaz_Cyrl.jsonl", "data/rus_Cyrl.jsonl", "data/eng_Latn.jsonl", "README.md"]

  - source_id: mangi_kk_support_qa
    url: https://huggingface.co/datasets/mangi-llm/kazakh-customer-support-qa
    revision: c687381ed78d59de46eb9f4640dfb8e85c90a69a
    licence: cc-by-4.0
    licence_evidence: >-
      HF card metadata `license: cc-by-4.0`; README "free to use ... including commercial use
      ... provided the original author is credited" for this 406-row public sample (the full
      ~10K set is a separate paid licence and is not used) (checked 2026-11-12).
    allowed_use: train
    status: selected
    languages: [kk]
    size: {rows: 406, files: 2, bytes: 278101}
    reviewed_at: 2026-11-12
    purpose: >-
      Native Kazakh customer questions from other industries (banking, telecom, billing): the
      out-of-scope (refuse_oos) task in Kazakh, which otherwise exists only as authored text.
    decision: >-
      The only licensed native-KK support data found. Its domains are not the store's, so
      only the off-domain subdomains are mapped to out_of_scope (taxonomy `sources:`); the
      in-domain-looking subdomains (service_center, sales, support) are excluded rather than
      guessed. Answers are generic bank/telecom advice and are never used as targets.
    notes: >-
      Attribution required: "Mäñgi ÜTM (mangi-llm), kazakh-customer-support-qa, CC BY 4.0".
      Curated by a community; the card says answers "appear to be manually written/templated";
      generation method of the questions is not documented. Questions are short (2-12 words).
    fetch:
      repo_id: mangi-llm/kazakh-customer-support-qa
      include: ["*.jsonl", "README.md"]

  - source_id: massive_en_ru
    url: https://huggingface.co/datasets/AmazonScience/massive
    revision: ed58ac423a2f4121720918bf5301577edce4ffd3
    licence: cc-by-4.0
    licence_evidence: >-
      HF card metadata `license: cc-by-4.0` and LICENSE file (main revision
      ff6bd8e4b27c3543e4f8fe2108f32bb95a6f8740); the pinned revision is the Hub's parquet
      conversion branch `refs/convert/parquet` of the same data (checked 2026-11-12).
    allowed_use: train
    status: selected
    languages: [en, ru]
    size: {rows: 33042, files: 6, bytes: 2497776}
    reviewed_at: 2026-11-12
    purpose: >-
      Human-written EN and human-localised RU virtual-assistant requests (weather, alarms,
      music, news, ...): the out-of-scope task with natural phrasing in EN and RU, plus
      greetings.
    decision: >-
      Selected for out_of_scope / greeting only. Intents that touch shopping (lists_*,
      takeaway_*), e-mail and the catch-all general_quirky are excluded; rows with the
      assistant wake word (Olly / Олли) are dropped. RU is localised by professional
      translators from the EN utterances, so EN and RU rows share content.
    notes: >-
      Attribution: FitzGerald et al. 2022, "MASSIVE: A 1M-Example Multilingual Natural
      Language Understanding Dataset", arXiv:2204.08582, CC BY 4.0. Lower-case, unpunctuated
      utterances (spoken-assistant style).
    fetch:
      repo_id: AmazonScience/massive
      include: ["en-US/*/0000.parquet", "ru-RU/*/0000.parquet"]

