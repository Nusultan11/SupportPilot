[project]
name = "supportpilot"
version = "0.1.0"
description = "Multilingual (RU/KK/EN) grounded customer-support assistant for an online store"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.2.14",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "lingua-language-detector>=2.2.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "polars>=2.1.0",
    "psutil>=7.2.2",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "reportlab>=5.1.0",
    "scipy>=1.18.1",
    "tokenizers>=0.23.3",
]

[project.scripts]
supportpilot = "supportpilot.cli:main"

[dependency-groups]
dev = [
    "mlflow[mcp]>=3.18.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-psutil>=7.2.2.20261111",
    "types-pyyaml>=6.0.12.20261111",
]
gpu = [
    "torch>=2.14.1",
]
ml = [
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "sacremoses>=0.1",
    "sentencepiece>=0.2",
    "transformers>=4.57",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportpilot"]

[tool.uv]
default-groups = ["dev", "gpu", "ml"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "S", "PTH", "C4", "PT", "RET"]
ignore = ["S101"]  # assert is fine in tests (and only used there)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "RUF001", "RUF003"]  # tests hold RU/KK text and unicode on purpose
# RU/KK linguistic tables (case forms, glossary, function words) are Cyrillic on purpose
"src/supportpilot/data/{textfmt,qe}.py" = ["RUF001", "RUF002", "RUF003"]
# KB date lines and RU/KK unit tables (Stage 5) are Cyrillic on purpose
"src/supportpilot/kb/{blocks,spec}.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mlflow.*", "qdrant_client.*", "pyarrow.*", "scipy.*", "reportlab.*", "openpyxl.*", "pdfplumber.*", "docx.*", "PIL.*", "bm25s.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: takes more than a few seconds (MLflow, torch)",
    "gpu: needs a CUDA device",
    "qdrant_server: needs a running Qdrant server (QDRANT_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:mlflow.*"]
