# External grounded-response component (ADR-043, DATA_CONTRACTS §20.1). doc2dial documents are
# US government service pages: their rules are evidence only inside `namespace`, never in the
# SupportPilot KB, and a target is a writer's response to the cited spans.
grounded:
  source_id: doc2dial
  namespace: doc2dial_external
  origin: human_written
  evidence: >-
    Feng et al. 2020 (EMNLP, §2.1): about 70 qualified appen.com contributors wrote every user
    and agent utterance from a dialogue scene naming the document span to ground it in; the
    span references are the writer's own grounding, not an independent verification.
  acts:
    respond_solution: answer
    respond_solution_positive: answer
    respond_solution_negative: answer
    query_condition: clarify
  min_evidence_recall: 0.5
