    cross_lingual: true
  - id: scale_tv43_mount
    family_id: television_mounting
    need_key: tv4302_mount_pattern_not_tv5501
    category: hard
    en: 'Will a mount described only as 200 by 200 match the mounting pattern listed for TV-4302?'
    ru: 'Совпадает ли крепление с маркировкой только 200 на 200 со схемой отверстий, указанной у TV-4302?'
    kk: 'Тек 200 де 200 деп белгіленген бекіткіш TV-4302 үшін көрсетілген тесік сызбасына сәйкес пе?'
    mix_ru: 'Для TV-4302 тесік аралығы қандай: 200 на 200 ма, әлде другое?'
    relevant: [{section: display_connections.tv43_mount, grade: 3}, {section: display_connections.tv55_mount, grade: 0}]
    required: [{fact: display_tv43_mount, sections: [display_connections.tv43_mount]}]
    rationale: TV-4302 specifies 200 x 100, so a sole 200 x 200 marking is insufficient to establish fit.
    tags: [product_dimensions, hard_negative]
  - id: scale_laptop_video
    family_id: laptop_connector_capabilities
    need_key: lp1406_usb_c_data_does_not_imply_video
    category: hard
    en: 'LP-1406 has USB-C, so can I run a DisplayPort screen from it instead of using HDMI?'
    ru: 'У LP-1406 есть USB-C: значит, можно вывести через него DisplayPort на монитор вместо HDMI?'
    kk: 'LP-1406 үлгісінде USB-C бар: демек, HDMI орнына мониторға DisplayPort бейнесін сол арқылы шығаруға бола ма?'
    relevant: [{section: display_connections.laptop_video, grade: 3}]
    required: [{fact: display_laptop_video, sections: [display_connections.laptop_video]}]
    rationale: A data connector does not imply video capability; the source explicitly excludes DisplayPort.
    tags: [compatibility, misleading_premise]
    cross_lingual: true
  - id: scale_laptop_power
    family_id: laptop_connector_capabilities
    need_key: lp1406_usb_c_charge_adapter_exception
    category: hard
    en: 'Could a video adapter let the LP-1406 charge from my USB-C charger, or is its power connector still required?'
    ru: 'Видеоадаптер позволит зарядить LP-1406 от моей зарядки USB-C или всё равно нужен его разъём питания?'
    kk: 'Бейне адаптері LP-1406 үлгісін USB-C зарядтағышымен зарядтауға мүмкіндік бере ме, әлде өз қуат ұясы қажет пе?'
