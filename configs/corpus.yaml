  # ---------------------------------------------------------------- RU spoken e-banking requests
  minds14_ru:
    domain: banking_voice
    origin: {ru: human_spoken_asr}
    evidence: >-
      Gerz et al. 2021 (arXiv:2104.08524 §2, §4): native Russian speakers spoke new requests
      after an intent description and three examples; text is the Google ASR 1-best
      transcription (human wording, machine transcription, ASR errors kept).
    labels:
      atm_limit: {intent: out_of_scope}
      abroad:
        rules: [{cue: 'карт|банк|сч[её]т|снят|наличн', intent: out_of_scope}]
      balance:
        rules: [{cue: 'сч[её]т|банк|карт|кредит', intent: out_of_scope}]
      business_loan:
        rules: [{cue: 'бизнес|предпри|банк|кредит', intent: out_of_scope}]
      cash_deposit:
        rules: [{cue: 'сч[её]т|банк|банкомат|вклад|депозит', intent: out_of_scope}]
      joint_account:
        rules: [{cue: 'сч[её]т|банк', intent: out_of_scope}]
      app_error:
        veto: [{pattern: 'банк|сч[её]т|баланс|перевод|карт|транзакц', reason: "bank-specific app problem"}]
        rules: [{cue: 'приложени|сайт|не работает|не загруж|ошибк|завис|вылета|не открыва', intent: technical_issue}]
      address:  # the address on file (profile address), not the delivery address of an order
        veto: [{pattern: 'банк|карт|сч[её]т|корреспонденц|письм|прописк|официальн', reason: "address held by the bank"}]
        rules:
          - {cue: 'личн\w* кабинет|профил|аккаунт|уч[её]тн|адрес|мест\w* жительств|переех', intent: account_help}
      card_issues: {exclude: "card problem: reads as a store payment problem, not separable"}
      freeze: {exclude: "card/account freeze: ambiguous with fraud on a store account"}
      direct_debit: {exclude: "direct-debit requests include double charges (payment_problem)"}
      high_value_payment: {exclude: "bank payment authorisation: ambiguous with a store payment problem"}
      latest_transactions: {exclude: "transaction history includes unknown charges (payment_problem)"}
      pay_bill: {exclude: "bill payment: ambiguous with store invoices"}

  # ---------------------------------------------------------------- KK translated assistant requests
  xsid_kk:
    domain: virtual_assistant
    origin: {kk: human_localised}
    placement: heldout
    min_words: 2
    evidence: >-
      van der Goot et al. 2021 (NAACL §2.2): English Snips/Facebook dev+test utterances
      translated into Kazakh by native-speaker annotators (not MT). The paper states xSID is
      evaluation data only, so rows go to validation/test only.
