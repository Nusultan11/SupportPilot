items:
  - id: scale_tv55_arc
    family_id: television_audio_return
    need_key: tv5501_arc_socket_not_total_hdmi_count
    category: hard
    en: 'My soundbar needs audio return, not just a spare input. Which TV-5501 socket should I use?'
    ru: 'Саундбару нужен обратный звук, а не просто свободный вход. В какой разъём TV-5501 его подключить?'
    kk: 'Саундбарға жай бос кіріс емес, кері дыбыс арнасы керек. TV-5501 үлгісінің қай ұясына қосамын?'
    mix_kk: 'TV-5501 үшін саундбардың обратный звук арнасына қай HDMI керек?'
    relevant: [{section: display_connections.tv55_arc, grade: 3}, {section: display_connections.tv43_arc, grade: 0}]
    required: [{fact: display_tv55_arc, sections: [display_connections.tv55_arc]}]
    rationale: ARC socket is HDMI 2 on this exact model; the HDMI count and the smaller TV are insufficient.
    tags: [compatibility, hard_negative]
    cross_lingual: true
  - id: scale_tv43_arc
    family_id: television_audio_return
    need_key: tv4302_arc_socket_despite_included_bracket
    category: hard
    en: 'I bought the smaller TV-4302 with its bracket. Does that tell me where the soundbar return channel connects?'
    ru: 'Купил небольшой TV-4302 с кронштейном. Куда подключается обратный аудиоканал саундбара у этой модели?'
    kk: 'Кронштейні бар шағын TV-4302 сатып алдым. Осы үлгіде саундбардың кері дыбыс арнасы қайда қосылады?'
    relevant: [{section: display_connections.tv43_arc, grade: 3}, {section: display_connections.tv55_arc, grade: 0}]
    required: [{fact: display_tv43_arc, sections: [display_connections.tv43_arc]}]
    rationale: The smaller model uses HDMI 1; bracket inclusion is an intentionally irrelevant cue.
    tags: [compatibility, hard_negative]
  - id: scale_tv55_mount
    family_id: television_mounting
    need_key: tv5501_mount_pattern_and_bracket_inclusion
    category: simple
    en: 'For a TV-5501 wall installation, what screw-hole spacing and bracket contents are actually specified?'
    ru: 'Что именно указано для настенного крепления TV-5501: расстояние между отверстиями и наличие кронштейна?'
    kk: 'TV-5501 қабырға бекіткіші үшін тесіктер аралығы мен кронштейннің жинақта болуы қалай көрсетілген?'
    relevant: [{section: display_connections.tv55_mount, grade: 3}]
    required: [{fact: display_tv55_mount, sections: [display_connections.tv55_mount]}]
    rationale: The named source states both 200 x 200 mm and exclusion of a wall bracket.
