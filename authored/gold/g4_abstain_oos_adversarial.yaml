# Gold benchmark source, part 4: no-evidence questions, out-of-scope requests, prompt
# injection and conflicting claims. Authored separately from training by the Stage 4 agent
# (LLM); review status `draft`.
# abstain: the demo-store KB has no answer; a correct reply says so (no invented policy)
# and may offer an operator. conflicting: the customer's claim contradicts the KB; the
# reply follows the current KB and cites it.
schema_version: gold_src/1
items:
  - {id: ab_bishkek, cat: abstain, diff: medium, intent: delivery_time, action: answer_kb, must_not: ["delivery to Bishkek takes"],
     en: "Do you deliver to Bishkek, and how long does it take?", ru: "Доставляете в Бишкек? Сколько по времени?", kk: "Бішкекке жеткізесіздер ме? Қанша уақыт алады?"}
