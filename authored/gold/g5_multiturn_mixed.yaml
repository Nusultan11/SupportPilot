    cat: multi_turn
    diff: hard
    intent: account_help
    action: escalate
    esc: fraud_suspected
    en: ["I keep getting login codes I didn't request", "Sign-in works with a one-time SMS code; codes are sent when someone enters your number at sign-in.", "and now there's a new order in my account I didn't place"]
    ru: ["мне приходят коды входа, которые я не запрашивал", "Вход выполняется по одноразовому коду из SMS; код приходит, когда кто-то вводит ваш номер при входе.", "а теперь в аккаунте новый заказ, которого я не делал"]
