  whileai_ecommerce_intent:
    summary: 'LLM-generated payment-agent dialogues (OpenAI/Anthropic batch ids in conv_id), 2-60 turns.
      Labels describe the outcome of the whole dialogue (committed payment action or none), not the first
      message: the first turn is often a greeting, small talk or another topic. In the random sample about
      half of the dialogues are outside an online store (crypto, P2P transfers, utility bills, investing,
      homework, travel). Generation defects: 147 dialogues with token-soup turns were rejected; the detector
      misses single-script word salad (3 of the reviewed flagged rows). Realistic-looking e-mail addresses
      and phone numbers appear in 7% of dialogues (masked with synthetic values); obfuscated forms such
      as "name dot surname at gmail" are not caught.'
    verdict: 'Not usable as canonical single-message examples. Valuable as a style and multi-turn reference:
      informal register, emoji, late intent disclosure, clarification turns.'
    recommendation: Keep pending. In Stage 4 take only in-domain dialogues (orders, returns, subscriptions,
      store payments) for multi-turn and clarification tasks, relabel them with the v1 taxonomy at dialogue
      level, and run an LLM-judge or human pass for coherence before use.
