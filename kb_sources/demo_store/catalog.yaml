# Demo-store record data (Stage 5, ADR-027): the product catalogue and the delivery zones of
# the fictional store in facts.yaml. Synthetic: no real products, prices or customers.
# Rendered by `supportpilot kb render` into catalog.xlsx and delivery_zones.csv (RU/KK/EN).
#
# SKUs and product names follow configs/locale_kz.yaml `products`, so the gold tool items
# (get_stock by SKU) refer to products the demo store sells. Prices are the demo store's own
# (KZT, integer). `desc` is a short attribute line written natively per language; the numbers
# in it are the same in every language (checked by the `kb` cross-lingual gate).
# Warranty comes from facts.yaml `warranty_months` for the categories in `warranty_categories`.
