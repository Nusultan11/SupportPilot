# Demo-store canonical facts (seeded in Stage 4, owned by Stage 5; ROADMAP §Stage 5).
# The fictional Kazakhstan store the running system answers about. Stage 5 renders these
# facts into PDF/DOCX/XLSX/CSV/JSON/TXT documents in RU/KK/EN.
#
# Stage 4 needs them for two things:
#   1. the gold benchmark: expected answers and required facts refer to these keys;
#   2. the `kb_variant_distinct` gate: no training KB variant (authored/kb_train/variants.yaml)
#      may reuse a value listed here, so the SFT data never teaches the demo policy.
# Changing a value here requires re-running `supportpilot data sft` (gate) and
# `supportpilot data gold` (expected facts). Synthetic; no real store.
