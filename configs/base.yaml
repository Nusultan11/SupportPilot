# Base configuration. Override any key with SUPPORTPILOT_<SECTION>__<KEY>,
# e.g. SUPPORTPILOT_LOGGING__LEVEL=DEBUG. Secrets go in .env or the environment, never here.
# Relative paths resolve against the project root.
env: dev

paths:
  data_dir: data
  artifacts_dir: artifacts
  reports_dir: artifacts/reports

data:
  registry: configs/sources.yaml   # source registry: licences, revisions, decisions
  taxonomy: configs/taxonomy.yaml  # intent taxonomy v1 (product contract)
  corpus_recipe: configs/corpus.yaml  # Stage 1 corpus recipe (labels, splits, dedup)
  collection_plan: configs/collection.yaml  # commissioned collection + review (ADR-049)
  download_retries: 3              # per file; partial downloads resume

logging:
  level: INFO
  format: json        # json | console
  log_text: false     # true only for local debugging: logs customer text verbatim

backup:
  root: backups                   # must stay git-ignored
  keep_per_name: 3                # newest N per name, plus pinned ones

mlflow:
  db_path: mlruns/mlflow.db
  artifact_root: mlruns/artifacts
  experiment_prefix: supportpilot
