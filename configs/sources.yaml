  - source_id: mangi_kk_support_qa
    url: https://huggingface.co/datasets/mangi-llm/kazakh-customer-support-qa
    revision: c687381ed78d59de46eb9f4640dfb8e85c90a69a
    licence: cc-by-4.0
    licence_evidence: >-
      HF card metadata `license: cc-by-4.0`; README "free to use ... including commercial use
      ... provided the original author is credited" for this 406-row public sample (the full
      ~10K set is a separate paid licence and is not used) (checked 2026-11-12).
    allowed_use: train
    status: selected
    languages: [kk]
    size: {rows: 406, files: 2, bytes: 278101}
    reviewed_at: 2026-11-12
    purpose: >-
      Native Kazakh customer questions from other industries (banking, telecom, billing): the
      out-of-scope (refuse_oos) task in Kazakh, which otherwise exists only as authored text.
    decision: >-
      The only licensed native-KK support data found. Its domains are not the store's, so
      only the off-domain subdomains are mapped to out_of_scope (taxonomy `sources:`); the
      in-domain-looking subdomains (service_center, sales, support) are excluded rather than
      guessed. Answers are generic bank/telecom advice and are never used as targets.
    notes: >-
      Attribution required: "Mäñgi ÜTM (mangi-llm), kazakh-customer-support-qa, CC BY 4.0".
      Curated by a community; the card says answers "appear to be manually written/templated";
      generation method of the questions is not documented. Questions are short (2-12 words).
    fetch:
      repo_id: mangi-llm/kazakh-customer-support-qa
      include: ["*.jsonl", "README.md"]

  - source_id: massive_en_ru
    url: https://huggingface.co/datasets/AmazonScience/massive
    revision: ed58ac423a2f4121720918bf5301577edce4ffd3
    licence: cc-by-4.0
    licence_evidence: >-
      HF card metadata `license: cc-by-4.0` and LICENSE file (main revision
      ff6bd8e4b27c3543e4f8fe2108f32bb95a6f8740); the pinned revision is the Hub's parquet
      conversion branch `refs/convert/parquet` of the same data (checked 2026-11-12).
    allowed_use: train
    status: selected
    languages: [en, ru]
    size: {rows: 33042, files: 6, bytes: 2497776}
    reviewed_at: 2026-11-12
    purpose: >-
      Human-written EN and human-localised RU virtual-assistant requests (weather, alarms,
      music, news, ...): the out-of-scope task with natural phrasing in EN and RU, plus
      greetings.
    decision: >-
      Selected for out_of_scope / greeting only. Intents that touch shopping (lists_*,
      takeaway_*), e-mail and the catch-all general_quirky are excluded; rows with the
      assistant wake word (Olly / Олли) are dropped. RU is localised by professional
      translators from the EN utterances, so EN and RU rows share content.
    notes: >-
      Attribution: FitzGerald et al. 2022, "MASSIVE: A 1M-Example Multilingual Natural
      Language Understanding Dataset", arXiv:2204.08582, CC BY 4.0. Lower-case, unpunctuated
      utterances (spoken-assistant style).
    fetch:
      repo_id: AmazonScience/massive
      include: ["en-US/*/0000.parquet", "ru-RU/*/0000.parquet"]

  - source_id: abcd
    url: https://github.com/asappresearch/abcd
    revision: 6b8700ce67c6b37b062dd7a60abc76d7ef832a97
    licence: mit
    licence_evidence: >-
      Repository LICENSE "MIT License, Copyright (c) 2021 ASAPP Research" at the pinned commit
      (git blob f2dd20ad8cc771fd8d40be81b28880e6a7b4e28b); the data files are part of that
      repository; GitHub licence metadata MIT (checked 2026-11-17).
    allowed_use: train
    status: selected
    languages: [en]
    size: {rows: 10042, files: 6, bytes: 37099730}
    reviewed_at: 2026-11-17
    purpose: >-
      Human-human EN online-retail (clothing store) support chats with customer intents
      (55 subflows) and agent actions: the human-authored EN backbone of the human corpus
      (ADR-042): natural customer phrasing, multi-turn context, clarification and escalation.
    decision: >-
      Selected. Chen et al. 2021 (NAACL, arXiv:2104.00783) collected the dialogues in 2020 with
      Expert Live Chat: paid crowd workers role-played customers from a scenario prompt and
      trained workers acted as agents in real time; no generator model is involved. Human
      role-play, not real customers. Customer turns are user inputs; the latent flow/subflow
      label is the prompt the customer was given, mapped to v1 intents by an authored table
      and therefore `source_label_mapped`, not independent human adjudication. Agent turns
      state the fictional AcmeBrands policies and account values: never facts or targets for
      our store.
    notes: >-
      Attribution: Chen, Chen, Yang, Lin, Yu (2021) "Action-Based Conversations Dataset",
      ASAPP Research, MIT. Scenario `personal` fields are fictional customer profiles. Lowercase
      chat style, typos and multi-sentence turns are kept as written.
    fetch:
      type: github_repo
      repo_id: asappresearch/abcd
      include: ["data/abcd_v1.1.json.gz", "data/ontology.json", "data/kb.json", "data/guidelines.json", "LICENSE", "README.md"]

  # ------------------------------------------------------------------ human-corpus extension (2026-11-17, ADR-043)
  - source_id: minds14_ru
    url: https://huggingface.co/datasets/PolyAI/minds14
    revision: 40ce77cb32a384e4d50a568e1ec39ac804019d33
    licence: cc-by-4.0
    licence_evidence: >-
      HF card metadata `license: cc-by-4.0`; the paper (arXiv:2104.08524) releases the data
      as a "training and evaluation resource" (checked 2026-11-17).
    allowed_use: train
    status: selected
    languages: [ru]
    size: {rows: 539, files: 2, bytes: 34518082}
    reviewed_at: 2026-11-17
    purpose: >-
      Natural spoken Russian requests by native speakers (e-banking voice-assistant prompts):
      the first non-translated RU customer requests of the human corpus.
    decision: >-
      Selected for the human corpus only. Gerz et al. 2021 §2: native speakers recruited on
      Prolific spoke new utterances for an intent after seeing a description and three
      examples; the text is the Google ASR 1-best transcription of that speech (§4), so the
      origin is `human_spoken_asr` (human wording, machine transcription; ASR errors stay).
      Banking-only intents map to out_of_scope; app_error / address map to technical_issue /
      change_address only without bank-specific cues; card, debit, payment-history and bill
      intents are excluded because a store would treat them as payment problems.
    notes: >-
      Attribution: Gerz, Su, Kusztos, Mondal, Lis, Singhal, Mrksic, Wen, Vulic (2021)
      "Multilingual and Cross-Lingual Intent Detection from Spoken Data", PolyAI, CC BY 4.0.
      Only the ru-RU parquet is fetched; audio bytes are stored in the raw revision only.
    fetch:
      repo_id: PolyAI/minds14
      include: ["ru-RU/train-00000-of-00001.parquet", "README.md"]

  - source_id: xsid_kk
    url: https://github.com/mainlp/xsid
    revision: 761d926c3f2e9f6bea13192d2f39cec1d04d9777
    licence: cc-by-sa-4.0
    licence_evidence: >-
      Repository LICENSE "Attribution-ShareAlike 4.0 International" (git blob
      a73481c4be14b761eddf04cb18317cbc63416dc6) and GitHub licence metadata CC-BY-SA-4.0
      (checked 2026-11-17).
    allowed_use: train
    status: selected
    languages: [kk]
    size: {rows: 800, files: 4, bytes: 357188}
    reviewed_at: 2026-11-17
    purpose: >-
      Human-translated Kazakh virtual-assistant requests (alarm, reminder, weather, music,
      restaurants, films, books): Kazakh out-of-scope evaluation rows.
    decision: >-
      Selected for held-out splits only. van der Goot et al. 2021 (NAACL, §2.2): 800 English
      Snips/Facebook dev+test utterances translated by native-speaker annotators (not
      professional translators, not MT); the paper states xSID "is intended to serve as
      evaluation data only", so the recipe places these rows in validation/test, never train.
      The machine-translated `projectedTrain` files are not fetched.
    notes: >-
      Attribution: van der Goot, Sharaf, Imankulova, Ustun, Stepanovic, Ramponi, Khairunnisa,
      Komachi, Plank (2021) "From Masked Language Modeling to Translation", xSID 0.7, CC BY-SA 4.0
      (derived data that is shared must keep the licence).
    fetch:
      type: github_repo
      repo_id: mainlp/xsid
      include: ["data/xSID-0.7/kk.valid.conll", "data/xSID-0.7/kk.test.conll", "LICENSE", "README.md"]

  - source_id: clinc150
    url: https://huggingface.co/datasets/clinc/clinc_oos
    revision: 155b9c710419136e17307b80d0a13e68cd46b4ec
    licence: cc-by-3.0
    licence_evidence: "HF card metadata `license: cc-by-3.0` (checked 2026-11-17)"
    allowed_use: train
    status: selected
    languages: [en]
    size: {rows: 23700, files: 4, bytes: 526729}
    reviewed_at: 2026-11-17
    purpose: >-
      Crowd-written EN assistant queries: greetings/thanks, card-declined payment problems and
      out-of-scope domains (travel, kitchen, auto, work, small talk) for the human corpus.
    decision: >-
      Selected for the human corpus only. Larson et al. 2019 (EMNLP, §3): queries written by
      crowd workers from scenario and paraphrase prompts. Only labels with an unambiguous v1
      meaning are mapped; banking/credit-card account labels, the generic `oos` class and
      labels that order goods through a third party are excluded.
    notes: >-
      Attribution: Larson et al. (2019) "An Evaluation Dataset for Intent Classification and
      Out-of-Scope Prediction", CC BY 3.0. The `plus` configuration is fetched.
    fetch:
      repo_id: clinc/clinc_oos
      include: ["plus/*.parquet", "README.md"]

  - source_id: doc2dial
    url: https://github.com/doc2dial/sharedtask-dialdoc2021
    revision: 7584ac0c1c617496d644f1ea34a6b812a5771539
    licence: cc-by-3.0
    licence_evidence: >-
      IBM's dataset card huggingface.co/datasets/IBM/doc2dial (rev
      fc8ede49f0d67fcb21dbcbc1bde387a6ef7a126b): metadata `license: cc-by-3.0` and "Licensing
      Information: Creative Commons Attribution 3.0 Unported" for doc2dial v1.0.1. The shared-task
      repository that hosts the same v1.0.1 JSON files has no licence file (checked 2026-11-17).
    allowed_use: train
    status: selected
    languages: [en]
    size: {rows: 4470, files: 4, bytes: 81620306}
    reviewed_at: 2026-11-17
    purpose: >-
      Human-written, document-grounded agent responses with annotated evidence spans: the
      external grounded-response component of the human corpus (ADR-043).
    decision: >-
      Selected for the grounded component only. Feng et al. 2020 (EMNLP, §2.1): about 70
      qualified appen.com contributors wrote every user and agent utterance from a dialogue
      scene that names the grounding span. Documents are US government service pages
      (ssa.gov, va.gov, studentaid.gov, DMV): their rules are evidence only inside the
      component's own `doc2dial` namespace and never enter the SupportPilot KB.
    notes: >-
      Attribution: Feng, Wan, Gunasekara, Patel, Joshi, Lastras (2020) "doc2dial: A
      Goal-Oriented Document-Grounded Dialogue Dataset", IBM Research, CC BY 3.0. Only the
      train/validation dialogues are public; the shared-task test set is not used.
    fetch:
      type: github_repo
      repo_id: doc2dial/sharedtask-dialdoc2021
      include: ["data/doc2dial/v1.0.1/*.json", "data/doc2dial/DATA_README.md"]

