# Kazakhstan localisation catalogue (Stage 4, ADR-024). Validated by
# `supportpilot.data.locale.LocaleCatalog`. All values are synthetic or public geography;
# no real customer data. Used by: MT pre-localisation of Bitext slots, the authored
# scenario expander, the training KB variant and the mock tool states.
#
# Case forms are needed because RU and KK inflect place names and the templates use them:
#   kk: nom (Алматы), dat (Алматыға: "to"), loc (Алматыда: "in"), abl (Алматыдан: "from")
#   ru: nom (Алматы), to (в Алматы), in (в Алматы), from (из Алматы)
schema_version: locale/1
currency: KZT
# Bitext amounts are USD-like ($10-$2,500). They are converted with one fixed synthetic
# rate and rounded to a "shop price" step, so a localised text never shows dollars.
usd_to_kzt: 500
kzt_round_to: 100

cities:
  - {en: Almaty, ru: {nom: Алматы, to: в Алматы, in: в Алматы, from: из Алматы}, kk: {nom: Алматы, dat: Алматыға, loc: Алматыда, abl: Алматыдан}}
  - {en: Astana, ru: {nom: Астана, to: в Астану, in: в Астане, from: из Астаны}, kk: {nom: Астана, dat: Астанаға, loc: Астанада, abl: Астанадан}}
