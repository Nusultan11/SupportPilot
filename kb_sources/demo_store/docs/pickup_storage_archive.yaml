intro:
  - {en: 'Fictional store archive, valid from {archive_effective_from:date_full} through {archive_effective_to:date_full}. New pickup arrivals use the current delivery FAQ.', ru: 'Архив вымышленного магазина: действует с {archive_effective_from:date_full} по {archive_effective_to:date_full} включительно. Для новых поступлений в пункт выдачи действует текущий FAQ доставки.', kk: 'Ойдан шығарылған дүкен мұрағаты: {archive_effective_from:date_full} бастап {archive_effective_to:date_full} дейін қоса қолданылады. Беру пунктіне жаңадан келген сәлемдемелерге қазіргі жеткізу сұрақтары қолданылады.'}
sections:
