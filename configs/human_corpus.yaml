  # CLINC150 (plus). In-scope store meanings are capped higher than the out-of-scope domains.
  clinc150:
    greeting: {intent: greeting, cap: 60}
    thank_you: {intent: greeting, cap: 60}
    card_declined:
      cap: 60
      rules:
        - {pattern: '\b(?:at|in|from)\s+\w|\b(?:buy|buying|bought|purchase|purchasing|food|groceries|gas|lunch|dinner|coffee)\b', exclude: "card declined at another merchant/place or for an outside purchase"}
        - {pattern: "\\bdeclin|not (?:get )?accepted|denied|rejected|refused|(?:did not|didn't) go through", intent: payment_problem}
        - {pattern: '.', exclude: "no declined-payment cue"}
    order_status:
