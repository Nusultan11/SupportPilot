    heading: {en: 'How long was an arriving parcel kept?', ru: 'Сколько хранилась поступившая посылка?', kk: 'Келген сәлемдеме қанша сақталды?'}
    paragraphs:
      - {en: 'A parcel arriving at pickup during this validity interval was kept for {archive_pickup_keep_days:days}. The current storage period must not be inferred from this expired instruction.', ru: 'Посылка, поступившая в пункт выдачи в этот период, хранилась {archive_pickup_keep_days:days}. Из просроченной инструкции нельзя выводить текущий срок хранения.', kk: 'Осы әрекет мерзімінде беру пунктіне келген сәлемдеме {archive_pickup_keep_days:days} сақталды. Мерзімі өткен нұсқаулықтан қазіргі сақтау мерзімін тұжырымдауға болмайды.'}
