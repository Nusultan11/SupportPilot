[project]
name = "supportpilot"
version = "0.1.0"
description = "Multilingual (RU/KK/EN) grounded customer-support assistant for an online store"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=3.18.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
]

[project.scripts]
supportpilot = "supportpilot.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-psutil>=7.2.2.20261111",
    "types-pyyaml>=6.0.12.20261111",
]
gpu = [
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportpilot"]

[tool.uv]
default-groups = ["dev", "gpu"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "S", "PTH", "C4", "PT", "RET"]
ignore = ["S101"]  # assert is fine in tests (and only used there)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mlflow.*", "qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: takes more than a few seconds (MLflow, torch)",
    "gpu: needs a CUDA device",
    "qdrant_server: needs a running Qdrant server (QDRANT_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:mlflow.*"]
