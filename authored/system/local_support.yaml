# Controlled fictional diagnostic facts, not active store policies or human gold.
# Each need has EN/RU/KK/mixed claim, full proof, contradictory proof and partial proof.
schema_version: local_support_diagnostic/1
review_status: LLM_AUTHORED_DRAFT
needs:
  - id: voluntary_return_shipping
    claim: ["For a voluntary return, the customer pays the return courier.", "При добровольном возврате обратного курьера оплачивает покупатель.", "Ерікті қайтару кезінде кері курьер ақысын сатып алушы төлейді.", "При добровольном возврате кері курьерді сатып алушы төлейді."]
    full: ["If goods are returned voluntarily, the buyer bears the cost of the courier sending them back.", "При добровольном возврате товара расходы на курьера для обратной отправки несёт покупатель.", "Тауар ерікті түрде қайтарылса, кері жіберетін курьердің шығынын сатып алушы көтереді.", "Добровольный возврат: обратную курьерскую отправку сатып алушы төлейді."]
    counterfact: ["For voluntary returns, the store pays the return courier; the customer pays nothing.", "При добровольном возврате обратного курьера оплачивает магазин, покупатель не платит.", "Ерікті қайтару кезінде кері курьерді дүкен төлейді, сатып алушы төлемейді.", "Добровольный возврат: курьера оплачивает магазин, сатып алушы төлемейді."]
    partial: ["Voluntary returns may be requested through the application.", "Добровольный возврат можно запросить в приложении.", "Ерікті қайтаруды қолданба арқылы сұратуға болады.", "Добровольный возврат қолданба арқылы сұратылады."]
  - id: receipt_requirement
    claim: ["A receipt is mandatory when requesting a return.", "Для оформления возврата чек обязателен.", "Қайтаруды рәсімдеу үшін түбіртек міндетті.", "Для оформления возврата түбіртек міндетті."]
    full: ["Every return application must include a purchase receipt; applications without one are not accepted.", "Каждое заявление на возврат должно содержать чек покупки; без него заявления не принимают.", "Әр қайтару өтінішіне сатып алу түбіртегі қоса берілуі тиіс; онсыз өтініш қабылданбайды.", "К каждому заявлению на возврат түбіртек тіркелуі тиіс, онсыз қабылданбайды."]
    counterfact: ["A return application is accepted without a receipt; a receipt is optional.", "Заявление на возврат принимают без чека; чек необязателен.", "Қайтару өтініші түбіртексіз қабылданады, түбіртек міндетті емес.", "Заявление принимается без чека, түбіртек міндетті емес."]
    partial: ["Return applications are submitted at the service counter.", "Заявления на возврат подают на стойке обслуживания.", "Қайтару өтініштері қызмет көрсету орнына беріледі.", "Заявления на возврат қызмет көрсету орнына беріледі."]
  - id: inspection_before_refund
    claim: ["The refund is issued only after the returned goods are inspected.", "Деньги возвращают только после осмотра возвращённого товара.", "Ақша қайтарылған тауар тексерілгеннен кейін ғана қайтарылады.", "Возврат денег только после осмотра, тауар тексерілгеннен кейін."]
    full: ["An inspection of the returned goods must be completed before any refund is issued.", "Осмотр возвращённого товара должен завершиться до перечисления возврата денег.", "Ақшаны қайтарудан бұрын кері келген тауарды тексеру аяқталуы тиіс.", "Перед перечислением возврата кері келген тауарды тексеру аяқталуы тиіс."]
    counterfact: ["The refund is issued before inspection and does not wait for inspection.", "Деньги возвращают до осмотра, не ожидая его результатов.", "Ақша тексеруден бұрын қайтарылады, тексеруді күтпейді.", "Деньги возвращают до осмотра, тексеруді күтпейді."]
    partial: ["Returned goods are registered in the warehouse.", "Возвращённый товар регистрируют на складе.", "Қайтарылған тауар қоймада тіркеледі.", "Возвращённый товар қоймада тіркеледі."]
  - id: water_damage_exclusion
    claim: ["Damage caused by immersion in water is excluded from this warranty.", "Повреждение от погружения в воду не покрывается этой гарантией.", "Суға батырудан болған зақым бұл кепілдікпен қамтылмайды.", "Повреждение от погружения в воду кепілдікке кірмейді."]
    full: ["This warranty does not cover any damage resulting from the product being submerged in water.", "Эта гарантия не распространяется на повреждения вследствие погружения изделия в воду.", "Бұл кепілдік бұйымды суға батыру салдарынан болған зақымға қолданылмайды.", "Гарантия не распространяется на зақым, егер бұйым суға батырылса."]
    counterfact: ["This warranty explicitly covers damage caused by immersion in water.", "Эта гарантия прямо покрывает повреждения от погружения в воду.", "Бұл кепілдік суға батырудан болған зақымды тікелей қамтиды.", "Эта гарантия погружение в воду салдарындағы зақымды қамтиды."]
    partial: ["Warranty cases are submitted with a written description of the fault.", "По гарантийным случаям подают письменное описание неисправности.", "Кепілдік жағдайында ақаудың жазбаша сипаттамасы беріледі.", "Для гарантийного случая ақаудың сипаттамасы керек."]
  - id: cancellation_record_is_request
    claim: ["Recording a cancellation request does not mean the order has been cancelled.", "Запись запроса на отмену не означает, что заказ уже отменён.", "Болдырмау өтінішінің тіркелуі тапсырыстың болдырылғанын білдірмейді.", "Запись запроса на отмену тапсырыстың болдырылғанын білдірмейді."]
    full: ["Cancellation-request registration acknowledges only the request. Cancellation is a separate later decision.", "Регистрация запроса на отмену подтверждает только обращение. Отмена — отдельное последующее решение.", "Болдырмау өтінішін тіркеу тек өтінішті растайды. Болдырмау туралы шешім кейін бөлек қабылданады.", "Регистрация подтверждает только запрос, болдырмау кейін бөлек шешіледі."]
    counterfact: ["Registering a cancellation request immediately cancels the order automatically.", "Регистрация запроса на отмену немедленно автоматически отменяет заказ.", "Өтініш тіркелген сәтте тапсырыс автоматты түрде жойылады.", "Регистрация запроса немедленно отменяет заказ, тапсырыс сол сәтте жойылады."]
    partial: ["Cancellation requests receive a registration identifier.", "Запросам на отмену присваивают регистрационный номер.", "Болдырмау өтініштеріне тіркеу нөмірі беріледі.", "Запросу на отмену тіркеу нөмірі беріледі."]
  - id: gift_card_cash_refund
    claim: ["The gift card cannot be refunded as cash.", "Подарочную карту нельзя вернуть в обмен на наличные.", "Сыйлық картасын қолма-қол ақшаға қайтаруға болмайды.", "Подарочную карту қолма-қол ақшаға қайтаруға болмайды."]
    full: ["Gift-card balances are not redeemable for cash and cash refunds of gift cards are not available.", "Баланс подарочной карты не обменивают на наличные; возврат карты наличными недоступен.", "Сыйлық картасының қалдығы қолма-қол ақшаға айырбасталмайды; картаны қолма-қол ақшамен қайтару қарастырылмаған.", "Баланс подарочной карты наличными не возвращают, қолма-қол ақшаға айырбасталмайды."]
    counterfact: ["Gift cards may be returned for a full cash refund.", "Подарочные карты можно вернуть с полным возмещением наличными.", "Сыйлық карталарын толық сомасын қолма-қол алып қайтаруға болады.", "Подарочные карты можно вернуть, толық сомасын қолма-қол алуға болады."]
    partial: ["Gift cards can be presented at the checkout.", "Подарочную карту можно предъявить на кассе.", "Сыйлық картасын кассада көрсетуге болады.", "Подарочную карту кассада көрсетуге болады."]
  - id: loyalty_expiry
    claim: ["Unused loyalty credits expire after three months.", "Неиспользованные бонусы сгорают через три месяца.", "Пайдаланылмаған бонустар үш айдан кейін жойылады.", "Неиспользованные бонусы үш айдан кейін жойылады."]
    full: ["Loyalty credits remain valid for three months; unused credits are removed at the end of that period.", "Бонусы действуют три месяца; по окончании этого срока неиспользованный остаток удаляется.", "Бонустар үш ай бойы жарамды; осы мерзім біткенде пайдаланылмаған қалдық жойылады.", "Бонусы действуют три месяца, мерзім біткенде қалдық жойылады."]
    counterfact: ["Unused loyalty credits never expire and remain available without a time limit.", "Неиспользованные бонусы никогда не сгорают и доступны бессрочно.", "Пайдаланылмаған бонустар ешқашан жойылмайды және мерзімсіз қолжетімді.", "Неиспользованные бонусы никогда не сгорают, мерзімсіз қолжетімді."]
    partial: ["Loyalty credits are shown in the customer profile.", "Бонусы отображаются в профиле покупателя.", "Бонустар сатып алушының профилінде көрсетіледі.", "Бонусы в профиле покупателя көрсетіледі."]
  - id: delegated_pickup_authority
    claim: ["Someone collecting goods for the buyer must present written authorization.", "Получатель, забирающий товар за покупателя, должен предъявить письменное разрешение.", "Тауарды сатып алушының орнына алатын адам жазбаша рұқсат көрсетуі тиіс.", "Получатель вместо покупателя жазбаша рұқсат көрсетуі тиіс."]
    full: ["When goods are collected by a representative, written authorization from the buyer is mandatory.", "При получении товара представителем письменное разрешение покупателя обязательно.", "Тауарды өкіл алған кезде сатып алушының жазбаша рұқсаты міндетті.", "При получении представителем сатып алушының жазбаша рұқсаты міндетті."]
    counterfact: ["Any representative may collect the goods without written authorization from the buyer.", "Любой представитель может забрать товар без письменного разрешения покупателя.", "Кез келген өкіл тауарды сатып алушының жазбаша рұқсатынсыз ала алады.", "Любой представитель может забрать товар, жазбаша рұқсат керек емес."]
    partial: ["Goods are collected from the collection counter.", "Товар забирают на стойке выдачи.", "Тауар беру орнынан алынады.", "Товар забирают на стойке, беру орнында."]
irrelevant: ["The catalogue describes available materials and product colours.", "В каталоге описаны материалы и расцветки товаров.", "Каталогта тауарлардың материалдары мен түстері сипатталған.", "В каталоге тауарлардың материалдары мен түстері көрсетілген."]
