display_tv55_arc: {en: 'TV-5501 sends ARC audio through HDMI 2; the other HDMI sockets do not carry ARC audio.', ru: 'TV-5501 передаёт звук ARC через HDMI 2; остальные разъёмы HDMI не передают звук ARC.', kk: 'TV-5501 ARC дыбысын HDMI 2 арқылы жібереді; басқа HDMI ұялары ARC дыбысын жібермейді.'}
display_tv43_arc: {en: 'TV-4302 sends ARC audio through HDMI 1. The included wall bracket does not add audio connections.', ru: 'TV-4302 передаёт звук ARC через HDMI 1. Комплектное настенное крепление не добавляет аудиоразъёмов.', kk: 'TV-4302 ARC дыбысын HDMI 1 арқылы жібереді. Жинақтағы қабырға бекіткіші дыбыс ұяларын қоспайды.'}
display_tv55_mount: {en: 'TV-5501 uses a VESA 200 x 200 mm mounting pattern. A wall bracket is not included.', ru: 'Для TV-5501 используется крепление VESA 200 x 200 мм. Настенный кронштейн не входит в комплект.', kk: 'TV-5501 үшін VESA 200 x 200 мм бекіткіші қолданылады. Қабырға кронштейні жинаққа кірмейді.'}
display_tv43_mount: {en: 'TV-4302 uses VESA 200 x 100 mm; only the bracket listed in its package contents is included.', ru: 'TV-4302 использует VESA 200 x 100 мм; в комплект входит только кронштейн, указанный в составе поставки.', kk: 'TV-4302 үшін VESA 200 x 100 мм қолданылады; жинаққа жеткізу құрамында көрсетілген кронштейн ғана кіреді.'}
display_laptop_video: {en: 'LP-1406 has an HDMI 2.0 video output. Its USB-C socket transfers data but does not support DisplayPort video.', ru: 'LP-1406 имеет видеовыход HDMI 2.0. Его разъём USB-C передаёт данные, но не поддерживает видео DisplayPort.', kk: 'LP-1406 үлгісінде HDMI 2.0 бейне шығысы бар. USB-C ұясы деректерді жібереді, бірақ DisplayPort бейнесін қолдамайды.'}
display_laptop_power: {en: 'LP-1406 uses its round power connector; USB-C charging is not supported. A video adapter cannot change this power requirement.', ru: 'LP-1406 питается через круглый разъём; зарядка по USB-C не поддерживается. Видеоадаптер не меняет это требование к питанию.', kk: 'LP-1406 дөңгелек қуат ұясы арқылы қоректенеді; USB-C арқылы зарядтау қолдау таппайды. Бейне адаптері бұл қуат талабын өзгертпейді.'}
charging_pb20_shared: {en: 'PB-2010 provides up to 22.5 W to a compatible single device; when both USB-C outputs are used, their combined output is limited to 15 W.', ru: 'PB-2010 выдаёт до 22.5 Вт одному совместимому устройству; при использовании обоих выходов USB-C их суммарная мощность ограничена 15 Вт.', kk: 'PB-2010 бір үйлесімді құрылғыға 22.5 Вт-қа дейін береді; екі USB-C шығысы қатар қолданылса, олардың жалпы қуаты 15 Вт-пен шектеледі.'}
charging_pb10_shared: {en: 'PB-1005 supplies up to 18 W through one output. With USB-A and USB-C used together, the total is limited to 12 W.', ru: 'PB-1005 выдаёт до 18 Вт через один выход. При одновременной работе USB-A и USB-C суммарная мощность ограничена 12 Вт.', kk: 'PB-1005 бір шығыс арқылы 18 Вт-қа дейін береді. USB-A мен USB-C қатар қолданылса, жалпы қуат 12 Вт-пен шектеледі.'}
charging_pb20_input: {en: 'PB-2010 accepts charging through either USB-C socket; it does not have a wireless charging coil.', ru: 'PB-2010 заряжается через любой из разъёмов USB-C; катушки беспроводной зарядки у него нет.', kk: 'PB-2010 кез келген USB-C ұясы арқылы зарядталады; онда сымсыз зарядтау орамы жоқ.'}
charging_pb10_input: {en: 'Recharge PB-1005 through USB-C. Its USB-A port is output-only and cannot recharge the power bank.', ru: 'Заряжайте PB-1005 через USB-C. Порт USB-A работает только на выход и не заряжает сам пауэрбанк.', kk: 'PB-1005 құрылғысын USB-C арқылы зарядтаңыз. USB-A порты тек шығыс ретінде жұмыс істейді және пауэрбанктің өзін зарядтамайды.'}
charging_hp_wired: {en: 'HP-0312 uses USB-C digital audio and needs no battery charging. It has no 3.5 mm plug.', ru: 'HP-0312 использует цифровой звук USB-C и не требует зарядки аккумулятора. Штекера 3.5 мм у него нет.', kk: 'HP-0312 USB-C цифрлық дыбысын қолданады және аккумуляторды зарядтауды қажет етпейді. Онда 3.5 мм ашасы жоқ.'}
charging_hp_wireless: {en: 'HP-0305 charges through USB-C with a cable; its Bluetooth playback specification does not imply wireless charging support.', ru: 'HP-0305 заряжается кабелем через USB-C; характеристика воспроизведения по Bluetooth не означает поддержку беспроводной зарядки.', kk: 'HP-0305 кабельмен USB-C арқылы зарядталады; Bluetooth арқылы ойнату сипаттамасы сымсыз зарядтауды қолдайтынын білдірмейді.'}
care_dress: {en: 'Wash DR-1131 on a delicate cycle at 30 C, without bleach. Dry it away from direct sunlight.', ru: 'Стирайте DR-1131 в деликатном режиме при 30 C без отбеливателя. Сушите вдали от прямых солнечных лучей.', kk: 'DR-1131 көйлегін ағартқышсыз, нәзік режимде 30 C-та жуыңыз. Тікелей күн сәулесінен алыс кептіріңіз.'}
care_shirt: {en: 'SH-0410 permits a cotton wash cycle at 40 C. Wash dark colours separately and unbutton the shirt first.', ru: 'SH-0410 допускает режим стирки хлопка при 40 C. Тёмные цвета стирайте отдельно, предварительно расстегнув рубашку.', kk: 'SH-0410 жейдесін мақта режимінде 40 C-та жууға болады. Қара түстерді бөлек жуып, алдымен түймелерін ағытыңыз.'}
care_jeans: {en: 'Turn JN-2232 inside out and wash at 30 C with similar colours. Do not use chlorine bleach.', ru: 'Выверните JN-2232 наизнанку и стирайте при 30 C с похожими цветами. Не используйте хлорный отбеливатель.', kk: 'JN-2232 шалбарын теріс айналдырып, түстес киімдермен 30 C-та жуыңыз. Хлорлы ағартқышты қолданбаңыз.'}
care_backpack: {en: 'Wipe BG-0711 with a soft damp cloth and dry at room temperature. Do not immerse the leather backpack or put it in a washing machine.', ru: 'Протирайте BG-0711 мягкой влажной тканью и сушите при комнатной температуре. Не погружайте кожаный рюкзак в воду и не стирайте в машине.', kk: 'BG-0711 сөмкесін жұмсақ дымқыл шүберекпен сүртіп, бөлме температурасында кептіріңіз. Былғары сөмкені суға батырмаңыз және машинада жумаңыз.'}
care_blanket: {en: 'BL-1515 may be machine-washed at 40 C on a gentle cycle. Dry it fully before placing it in a closed storage bag.', ru: 'BL-1515 можно стирать в машине при 40 C в щадящем режиме. Полностью высушите одеяло перед хранением в закрытом чехле.', kk: 'BL-1515 көрпесін машинада 40 C-та жұмсақ режимде жууға болады. Жабық қапқа салмас бұрын толық кептіріңіз.'}
care_jacket: {en: 'JK-0560 uses professional wet cleaning; household machine washing is excluded by this care instruction. Do not store the down jacket compressed while damp.', ru: 'Для JK-0560 предусмотрена профессиональная аквачистка; домашняя машинная стирка исключена этой инструкцией. Не храните влажный пуховик сжатым.', kk: 'JK-0560 күртесіне кәсіби сумен тазалау қарастырылған; бұл нұсқаулық үйдегі машинада жууды көздемейді. Дымқыл мамық күртені сығылған күйде сақтамаңыз.'}
packing_screen: {en: 'For TV transport to service, protect the screen with a rigid cover and fill empty space in the box. A loose blanket alone is not protective packaging.', ru: 'Для перевозки телевизора в сервис закройте экран жёсткой защитой и заполните пустоты в коробке. Одно свободно наброшенное одеяло не является защитной упаковкой.', kk: 'Теледидарды сервиске тасымалдау үшін экранды қатты қорғанышпен жауып, қораптағы бос орынды толтырыңыз. Жай жабылған көрпе қорғаныш қаптама болып саналмайды.'}
packing_battery: {en: 'If a power bank is swollen, hot or leaking, stop using it and contact an operator before arranging shipment. This guide does not authorise ordinary postal shipment of a damaged battery.', ru: 'Если пауэрбанк вздулся, нагревается или протекает, прекратите использование и свяжитесь с оператором до оформления отправки. Эта инструкция не разрешает обычную почтовую отправку повреждённого аккумулятора.', kk: 'Пауэрбанк ісінсе, қызса немесе ақса, қолдануды тоқтатып, жөнелтуді рәсімдемес бұрын операторға хабарласыңыз. Бұл нұсқаулық зақымдалған аккумуляторды кәдімгі поштамен жіберуге рұқсат бермейді.'}
packing_accessories: {en: 'A service intake records the accessories actually handed over. Keep a copy of that list; a missing accessory must not be inferred from a generic package list.', ru: 'При приёме в сервис фиксируют фактически переданные принадлежности. Сохраните копию списка; отсутствие принадлежности нельзя выводить из общего состава комплекта.', kk: 'Сервиске қабылдағанда нақты тапсырылған керек-жарақтар тіркеледі. Тізімнің көшірмесін сақтаңыз; жалпы жинақ құрамына қарап керек-жарақтың жоқтығын тұжырымдауға болмайды.'}
packing_personal_data: {en: 'Before handing over a phone or laptop, make your own backup and remove personal accounts if the device allows it. The store does not copy customer files into the support knowledge base.', ru: 'Перед передачей телефона или ноутбука создайте свою резервную копию и удалите личные аккаунты, если устройство позволяет. Магазин не копирует файлы клиентов в базу знаний поддержки.', kk: 'Телефонды немесе ноутбукты тапсырар алдында жеке сақтық көшірме жасап, құрылғы мүмкіндік берсе, жеке аккаунттарды өшіріңіз. Дүкен клиент файлдарын қолдау қызметінің білім базасына көшірмейді.'}
packing_damage_record: {en: 'A visible-damage note records the condition at handover; it is not a final decision about warranty coverage. Coverage is determined by diagnostics.', ru: 'Запись о видимых повреждениях фиксирует состояние при передаче, но не является окончательным решением о гарантии. Гарантийность определяется диагностикой.', kk: 'Көрінетін зақым туралы жазба тапсыру кезіндегі күйді тіркейді, бірақ кепілдік жөніндегі соңғы шешім емес. Кепілдікке жатуы диагностикамен анықталады.'}
packing_repair_consent: {en: 'A paid repair requires separate approval after the diagnostic result and quote. Handing over the item alone does not approve an unspecified repair price.', ru: 'Платный ремонт требует отдельного согласия после диагностики и сметы. Сама передача товара не означает согласия с неуказанной ценой ремонта.', kk: 'Ақылы жөндеу диагностика мен сметадан кейін бөлек келісімді талап етеді. Тауарды тапсырудың өзі көрсетілмеген жөндеу бағасына келісуді білдірмейді.'}
