  bitext_customer_support:
    summary: 'Same generator as the retail set with a wider generic-support scope. Texts are shorter (keyword-mode
      rows such as "create account"), 25% contain entity placeholders, now filled with synthetic values.
      12.5% of rows are exact duplicates (removed). Several literal entities are glued to words ("purchase732201349959"),
      and when the text uses a literal value the response keeps the placeholder ({{Account Type}}, #{{Invoice
      Number}}), so text and response disagree. Some intents are outside the store domain (contract cancellation
      fees) or ambiguous (contact_customer_service). Responses for account intents have an exaggerated
      style ("embark on the magnificent adventure of editing your data"). The review found one currency
      mismatch introduced by Stage 3 filling (text in tenge, response in dollars); the catalogue now keeps
      "$" and the rows are consistent.'
    verdict: 'Usable for the 23 mapped source intents, mainly for slot-bearing requests (order, invoice,
      refund amount) that the retail set lacks. Low real diversity: 32 scenarios (28 in the canonical
      set).'
    recommendation: Use texts with their slot values for call_tool vs clarify behaviour. Exclude reference
      responses from training targets. Decide contact_customer_service vs human_agent and the shipping-address
      intents in the v1 taxonomy; localise money to KZT during Stage 4 translation, together with the
      response.
