# Assistant answer templates for the SFT targets (Stage 4, ADR-025). Authored natively in
# en/ru/kk by the Stage 4 agent (LLM); human review pending. Every number, date or price in
# an answer comes from a placeholder filled from the cited chunk or the tool result, so the
# grounding validator (common/grounding.py) can check it. Formats: see authored/kb_train/docs.yaml.
schema_version: responses/1

# answer_kb: one answer per KB section (doc_id.section_id). The values are the cited chunk's.
sections:
  returns_policy.window:
    en: "You can return an item within {return_window_days:days_gen} of delivery. It has to be unused, with its tags and original packaging, and you will need the order number or the receipt."
    ru: "Вернуть товар можно в течение {return_window_days:days_gen} после получения. Он должен быть без следов использования, с ярлыками и в оригинальной упаковке; понадобится номер заказа или чек."
    kk: "Тауарды алған күннен бастап {return_window_days:days_gen} ішінде қайтаруға болады. Ол пайдаланылмаған, жапсырмалары мен түпнұсқа қаптамасы сақталған болуы керек, тапсырыс нөмірі немесе чек қажет."
  returns_policy.non_returnable:
    en: "These items cannot be returned: {non_returnable:non_returnable}. If one of them turns out to be faulty, the warranty rules apply."
    ru: "Эти товары вернуть нельзя: {non_returnable:non_returnable}. Если такой товар оказался неисправным, действуют правила гарантии."
    kk: "Мына тауарларды қайтаруға болмайды: {non_returnable:non_returnable}. Олардың бірі ақаулы болып шықса, кепілдік ережелері қолданылады."
  returns_policy.how_to_return:
    en: "To return an item, open \"My orders\", choose the order and press \"Return\", then bring the item to a pickup point or hand it to the courier. Return shipping: {return_shipping_cost:kzt_free}."
    ru: "Чтобы вернуть товар, откройте «Мои заказы», выберите заказ и нажмите «Вернуть», затем сдайте товар в пункт выдачи или передайте курьеру. Обратная доставка: {return_shipping_cost:kzt_free}."
    kk: "Тауарды қайтару үшін «Менің тапсырыстарым» бөлімін ашып, тапсырысты таңдаңыз да, «Қайтару» батырмасын басыңыз, содан кейін тауарды беру пунктіне тапсырыңыз немесе курьерге беріңіз. Кері жеткізу: {return_shipping_cost:kzt_free}."
  returns_policy.refund:
    en: "Once the returned item has been checked, the money goes back to the card or account you paid with within {refund_days:wdays_gen}. Your bank may take a little longer to show it."
    ru: "После проверки возвращённого товара деньги поступят тем же способом, которым вы платили, в течение {refund_days:wdays_gen}. Банку может понадобиться ещё немного времени, чтобы их отразить."
    kk: "Қайтарылған тауар тексерілген соң, ақша сіз төлеген тәсілмен {refund_days:wdays_gen} ішінде қайтарылады. Банкке оны көрсету үшін тағы біраз уақыт керек болуы мүмкін."
  returns_policy.exchange:
    en: "You can exchange an item for another size, colour or model within {exchange_window_days:days_gen} of delivery, as long as the new one is in stock. Start the exchange in \"My orders\" or at a pickup point."
    ru: "Товар можно обменять на другой размер, цвет или модель в течение {exchange_window_days:days_gen} после получения, если нужный есть в наличии. Обмен оформляется в «Моих заказах» или в пункте выдачи."
    kk: "Қажетті тауар қоймада болса, оны алған күннен бастап {exchange_window_days:days_gen} ішінде басқа өлшемге, түске немесе үлгіге айырбастай аласыз. Айырбастауды «Менің тапсырыстарым» бөлімінде немесе беру пунктінде рәсімдеңіз."
  returns_policy.damaged_wrong:
    en: "Please report it within {defect_report_days:days_gen} of delivery with the order number and photos of the item and the packaging. The store then replaces the item or refunds it in full, delivery included."
    ru: "Сообщите об этом в течение {defect_report_days:days_gen} после получения, указав номер заказа и приложив фото товара и упаковки. Тогда магазин заменит товар или полностью вернёт деньги вместе с доставкой."
    kk: "Бұл туралы алған күннен бастап {defect_report_days:days_gen} ішінде тапсырыс нөмірін көрсетіп, тауар мен қаптаманың суретін тіркеп хабарлаңыз. Сонда дүкен тауарды ауыстырады немесе ақшаны жеткізу құнымен қоса толық қайтарады."
  delivery_policy.periods:
    en: "Delivery to Almaty and Astana takes {fast_delivery_days:range_days}, to other cities of Kazakhstan {region_delivery_days:range_days}, counted from the day the order ships."
    ru: "Доставка в Алматы и Астану занимает {fast_delivery_days:range_days}, в другие города Казахстана — {region_delivery_days:range_days} с момента отправки заказа."
    kk: "Алматы мен Астанаға жеткізу {fast_delivery_days:range_days}, Қазақстанның басқа қалаларына {region_delivery_days:range_days} алады, мерзім тапсырыс жөнелтілген күннен басталады."
  delivery_policy.cost:
    en: "Courier delivery: {courier_cost:kzt_free}, and it is free for orders from {free_delivery_from:kzt}. Picking the order up at a pickup point: {pickup_cost:kzt_free}."
    ru: "Курьерская доставка — {courier_cost:kzt_free}, для заказов от {free_delivery_from:kzt} она бесплатна. Самовывоз из пункта выдачи — {pickup_cost:kzt_free}."
    kk: "Курьерлік жеткізу — {courier_cost:kzt_free}, ал {free_delivery_from:kzt@abl} бастап тапсырыстар үшін тегін. Беру пунктінен өзіңіз алсаңыз — {pickup_cost:kzt_free}."
  delivery_policy.methods:
    en: "You can choose between {carriers:carriers} at checkout. The tracking number comes by SMS once the order ships."
    ru: "При оформлении можно выбрать: {carriers:carriers}. Трек-номер придёт в SMS, когда заказ отправят."
    kk: "Тапсырысты рәсімдегенде мыналарды таңдауға болады: {carriers:carriers}. Тапсырыс жөнелтілгенде трек-нөмір SMS арқылы келеді."
  delivery_policy.tracking:
    en: "You can see the current status of an order in \"My orders\". If you send me the six-digit order number, I can check it for you."
    ru: "Текущий статус заказа виден в разделе «Мои заказы». Если пришлёте шестизначный номер заказа, я проверю его."
    kk: "Тапсырыстың ағымдағы күйі «Менің тапсырыстарым» бөлімінде көрінеді. Алты таңбалы тапсырыс нөмірін жіберсеңіз, мен тексеріп беремін."
  payment_policy.methods:
    en: "{store_name:store} accepts {payment_methods:payment_methods}."
    ru: "{store_name:store} принимает: {payment_methods:payment_methods}."
    kk: "{store_name:store} дүкенінде төлеу тәсілдері: {payment_methods:payment_methods}."
  payment_policy.instalments:
    en: "Yes, with Kaspi Red you can pay in instalments over up to {instalment_months:months} with no overpayment; the option appears at checkout for eligible orders."
    ru: "Да, с Kaspi Red можно оформить рассрочку на срок до {instalment_months:months_gen} без переплаты; вариант появляется при оформлении для подходящих заказов."
    kk: "Иә, Kaspi Red арқылы артық төлемсіз {instalment_months:months@dat} дейін бөліп төлеуге болады; бұл мүмкіндік сәйкес тапсырыстарды рәсімдеу кезінде шығады."
  payment_policy.cod:
    en: "Yes, you can pay in cash or by card on delivery for orders up to {cod_max:kzt}."
    ru: "Да, оплатить наличными или картой при получении можно заказы на сумму до {cod_max:kzt}."
    kk: "Иә, {cod_max:kzt@dat} дейінгі тапсырыстарды алған кезде қолма-қол немесе картамен төлеуге болады."
  payment_policy.failed_payment:
    en: "Please check the card limit and the 3-D Secure confirmation and try again in 15 minutes. If money was taken but the order is still unpaid, the bank releases the hold automatically; if it does not, send me the order number."
    ru: "Проверьте лимит карты и подтверждение 3-D Secure и попробуйте снова через 15 минут. Если деньги списались, а заказ не оплачен, банк сам снимет блокировку; если этого не произошло, пришлите номер заказа."
    kk: "Карта лимитін және 3-D Secure растауын тексеріп, 15 минуттан кейін қайталап көріңіз. Ақша шегеріліп, тапсырыс әлі төленбеген болса, банк бұғаттауды өзі алып тастайды; олай болмаса, тапсырыс нөмірін жіберіңіз."
  payment_policy.receipts:
    en: "The electronic receipt is sent by e-mail and SMS after payment, and you can also find it in \"My orders\". Companies can ask for an invoice with the order number."
    ru: "Электронный чек приходит на e-mail и в SMS после оплаты, а также есть в «Моих заказах». Юрлица могут запросить счёт по номеру заказа."
    kk: "Электрондық чек төлемнен кейін e-mail мен SMS арқылы келеді, оны «Менің тапсырыстарым» бөлімінен де табуға болады. Заңды тұлғалар тапсырыс нөмірі бойынша шот сұрата алады."
  orders_policy.place:
    en: "Add the items to the cart, press \"Checkout\", choose delivery and payment and confirm the order. The minimum order is {min_order:kzt}."
    ru: "Добавьте товары в корзину, нажмите «Оформить», выберите доставку и оплату и подтвердите заказ. Минимальная сумма заказа — {min_order:kzt}."
    kk: "Тауарларды себетке салып, «Рәсімдеу» батырмасын басыңыз, жеткізу мен төлем тәсілін таңдап, тапсырысты растаңыз. Ең аз тапсырыс сомасы — {min_order:kzt}."
  orders_policy.cancel:
    en: "An order can be cancelled free of charge within {cancel_hours:hours_gen} of placing it, as long as it has not shipped. A shipped order can be refused on delivery or returned."
    ru: "Заказ можно бесплатно отменить в течение {cancel_hours:hours_gen} после оформления, пока он не отправлен. От отправленного заказа можно отказаться при получении или вернуть его."
    kk: "Тапсырысты рәсімдегеннен кейін {cancel_hours:hours_gen} ішінде, ол жөнелтілмей тұрғанда, тегін болдырмауға болады. Жөнелтілген тапсырысты алған кезде қабылдамауға немесе қайтаруға болады."
  orders_policy.change:
    en: "Items, quantities and the delivery address can be changed while the order is still \"processing\"; once it has shipped, it can no longer be changed."
    ru: "Товары, количество и адрес доставки можно изменить, пока заказ в статусе «в обработке»; после отправки изменить его уже нельзя."
    kk: "Тапсырыс «өңделуде» күйінде тұрғанда тауарларды, санын және жеткізу мекенжайын өзгертуге болады; жөнелтілгеннен кейін өзгерту мүмкін емес."
  warranty_policy.period:
    en: "Electronics and home appliances come with a warranty of {warranty_months:months} from the delivery date. Keep the receipt or the order number."
    ru: "На электронику и бытовую технику действует гарантия {warranty_months:months} с даты получения. Сохраните чек или номер заказа."
    kk: "Электроника мен тұрмыстық техникаға алған күннен бастап {warranty_months:months} кепілдік беріледі. Чекті немесе тапсырыс нөмірін сақтаңыз."
  warranty_policy.defect:
    en: "Report the defect within {defect_report_days:days_gen} of noticing it. The item is checked at a service centre and then repaired, replaced or refunded. If it overheats, sparks or smells of burning, stop using it."
    ru: "Сообщите о дефекте в течение {defect_report_days:days_gen} с момента, как его заметили. Товар проверят в сервисном центре и отремонтируют, заменят или вернут деньги. Если он перегревается, искрит или пахнет гарью, не пользуйтесь им."
    kk: "Ақауды байқаған күннен бастап {defect_report_days:days_gen} ішінде хабарлаңыз. Тауар сервис орталығында тексеріліп, жөнделеді, ауыстырылады немесе ақшасы қайтарылады. Ол қызып кетсе, ұшқын шашса немесе күйік иісі шықса, пайдаланбаңыз."
  store_info.showroom:
    en: "The showroom in {showroom:city} is at {showroom:address} and is open daily {showroom_hours:clock_range}."
    ru: "Шоурум в городе {showroom:city} находится по адресу: {showroom:address}, работает ежедневно {showroom_hours:clock_range}."
    kk: "{showroom:city} қаласындағы шоурум мына мекенжайда: {showroom:address}, күн сайын {showroom_hours:clock_range} жұмыс істейді."
  store_info.contact:
    en: "You can reach support by phone at {support_phone}, by e-mail at {support_email} or in the app chat, daily {support_hours:clock_range} (Astana time)."
    ru: "Связаться с поддержкой можно по телефону {support_phone}, по e-mail {support_email} или в чате приложения, ежедневно {support_hours:clock_range} (время Астаны)."
    kk: "Қолдау қызметімен {support_phone} телефоны, {support_email} поштасы немесе қосымшадағы чат арқылы байланысуға болады, күн сайын {support_hours:clock_range} (Астана уақыты)."
  store_info.sales:
    en: "The next big sale is {sale:sale_name}, from {sale:sale_from} to {sale:sale_to}; sale prices are shown in the catalogue."
    ru: "Ближайшая большая акция — {sale:sale_name}, с {sale:sale_from} по {sale:sale_to}; цены со скидкой будут в каталоге."
    kk: "Келесі ірі науқан — {sale:sale_name}, {sale:sale_from@abl} бастап {sale:sale_to@dat} дейін; жеңілдік бағалары каталогта көрсетіледі."
  store_info.loyalty:
    en: "Every purchase returns {loyalty_percent:percent} as bonus points. You can use one promo code per order, and it does not combine with other discounts. Gift cards are valid for {gift_card_months:months}."
    ru: "С каждой покупки возвращается {loyalty_percent:percent} бонусами. В заказе можно применить один промокод, он не суммируется с другими скидками. Подарочные карты действуют {gift_card_months:months}."
    kk: "Әр сатып алудан {loyalty_percent:percent} бонус ретінде қайтарылады. Бір тапсырысқа бір промокод қолданылады, ол басқа жеңілдіктермен қосылмайды. Сыйлық карталары {gift_card_months:months} жарамды."
  store_info.feedback:
    en: "Thank you for wanting to share it! You can rate a product in \"My orders\" after delivery, and send any suggestion about the store through the \"Feedback\" form in the app."
    ru: "Спасибо, что хотите поделиться! Оценить товар можно в «Моих заказах» после получения, а предложения о работе магазина — отправить через форму «Обратная связь» в приложении."
    kk: "Пікіріңізбен бөліскіңіз келгені үшін рақмет! Тауарды алғаннан кейін «Менің тапсырыстарым» бөлімінде бағалай аласыз, ал дүкен туралы ұсыныстарды қосымшадағы «Кері байланыс» формасы арқылы жіберіңіз."
  account_faq.create:
    en: "Press \"Sign in\", enter your phone number and the code from the SMS; the profile is created automatically."
    ru: "Нажмите «Войти», введите номер телефона и код из SMS — профиль создастся автоматически."
    kk: "«Кіру» батырмасын басып, телефон нөміріңізді және SMS-тегі кодты енгізіңіз — профиль автоматты түрде жасалады."
  account_faq.password:
    en: "There is no password to recover: you sign in with a one-time SMS code. If the code does not arrive, check the number and request a new one after 60 seconds."
    ru: "Пароль восстанавливать не нужно: вход выполняется по одноразовому коду из SMS. Если код не приходит, проверьте номер и запросите новый через 60 секунд."
    kk: "Құпиясөзді қалпына келтірудің қажеті жоқ: кіру бір реттік SMS кодымен жүзеге асады. Код келмесе, нөмірді тексеріп, 60 секундтан кейін жаңасын сұратыңыз."
  account_faq.profile:
    en: "You can change your name, e-mail and saved delivery addresses in \"Profile\" → \"Settings\". A new address is used for future orders only."
    ru: "Имя, e-mail и сохранённые адреса доставки меняются в разделе «Профиль» → «Настройки». Новый адрес будет использоваться только для следующих заказов."
    kk: "Аты-жөніңізді, e-mail-ді және сақталған жеткізу мекенжайларын «Профиль» → «Баптаулар» бөлімінде өзгерте аласыз. Жаңа мекенжай тек келесі тапсырыстарға қолданылады."
  account_faq.switch:
    en: "Sign out in \"Profile\" → \"Settings\" → \"Sign out\" and sign in with the other phone number. Orders and bonuses stay in the account where they were made."
    ru: "Выйдите через «Профиль» → «Настройки» → «Выйти» и войдите по другому номеру. Заказы и бонусы останутся в том аккаунте, где были оформлены."
    kk: "«Профиль» → «Баптаулар» → «Шығу» арқылы шығып, басқа нөмірмен кіріңіз. Тапсырыстар мен бонустар рәсімделген аккаунтта қалады."
  account_faq.delete:
    en: "You can request deletion in \"Profile\" → \"Settings\" → \"Delete account\". The account is deleted within {account_delete_days:days_gen}, and unused bonus points are lost."
    ru: "Запрос на удаление подаётся в разделе «Профиль» → «Настройки» → «Удалить аккаунт». Аккаунт удаляется в течение {account_delete_days:days_gen}, неиспользованные бонусы сгорают."
    kk: "Жою сұранысын «Профиль» → «Баптаулар» → «Аккаунтты жою» бөлімінде жіберуге болады. Аккаунт {account_delete_days:days_gen} ішінде жойылады, пайдаланылмаған бонустар күйіп кетеді."
  account_faq.history:
    en: "All your orders, with receipts and statuses, are in \"Profile\" → \"My orders\"."
    ru: "Все ваши заказы с чеками и статусами — в разделе «Профиль» → «Мои заказы»."
    kk: "Барлық тапсырыстарыңыз чектерімен және күйлерімен «Профиль» → «Менің тапсырыстарым» бөлімінде тұр."
  account_faq.newsletter:
    en: "You can subscribe or unsubscribe in \"Profile\" → \"Notifications\", or with the \"Unsubscribe\" link at the bottom of any of our e-mails."
    ru: "Подписаться или отписаться можно в разделе «Профиль» → «Уведомления» или по ссылке «Отписаться» внизу любого нашего письма."
    kk: "Жазылуға немесе бас тартуға «Профиль» → «Хабарламалар» бөлімінде немесе кез келген хатымыздың төменгі жағындағы «Жазылымнан бас тарту» сілтемесі арқылы болады."
  account_faq.app:
    en: "The app is in the App Store, Google Play and AppGallery; sign in with the same phone number you use on the website."
    ru: "Приложение есть в App Store, Google Play и AppGallery; входите по тому же номеру телефона, что и на сайте."
    kk: "Қосымша App Store, Google Play және AppGallery дүкендерінде бар; сайттағы телефон нөміріңізбен кіріңіз."
  account_faq.cart:
    en: "Press \"Add to cart\" on the product page. To remove an item, open the cart and press the bin icon next to it; the cart is kept for 30 days."
    ru: "Нажмите «В корзину» на странице товара. Чтобы убрать товар, откройте корзину и нажмите на значок корзины рядом с ним; корзина хранится 30 дней."
    kk: "Тауар бетіндегі «Себетке» батырмасын басыңыз. Тауарды алып тастау үшін себетті ашып, жанындағы қоқыс жәшігі белгішесін басыңыз; себет 30 күн сақталады."
  catalog.product:
    en: "The {product} (SKU {sku}) costs {price:kzt}."
    ru: "{product}, артикул {sku}, стоит {price:kzt}."
    kk: "{product} (артикулы {sku}) бағасы — {price:kzt}."
  catalog.product_warranty:
    en: "The {product} (SKU {sku}) costs {price:kzt} and comes with a warranty of {warranty_months:months}."
    ru: "{product}, артикул {sku}, стоит {price:kzt}, гарантия — {warranty_months:months}."
    kk: "{product} (артикулы {sku}) бағасы — {price:kzt}, кепілдік мерзімі — {warranty_months:months}."

