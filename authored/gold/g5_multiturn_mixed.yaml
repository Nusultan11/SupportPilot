    cat: multi_turn
    diff: hard
    intent: complaint
    action: escalate
    esc: complaint
    en: ["why was my parcel left outside in the rain??", "I'm sorry about that. Was anything damaged?", "everything is soaked. this is unacceptable, I want to file a complaint"]
    ru: ["почему мою посылку оставили на улице под дождём??", "Мне очень жаль. Что-то повредилось?", "всё промокло. это недопустимо, хочу подать жалобу"]
    kk: ["неге сәлемдемемді жаңбырдың астында далада қалдырдыңыздар??", "Өте өкінішті. Бірдеңе зақымдалды ма?", "бәрі су болды. бұл жол берілмейтін нәрсе, шағым түсіргім келеді"]
