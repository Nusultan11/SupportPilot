    kk: ["347120 тапсырысы келді, рақмет", "Келгеніне қуаныштымыз! Тағы немен көмектесейін?", "иә, жұмысқа оның чегі керек"]
  - id: mt_free_delivery_math
    cat: multi_turn
    diff: hard
    intent: delivery_options_cost
    action: answer_kb
    ev: [delivery_policy.cost]
    facts: {free_delivery_from: "25000"}
    en: ["how much is the courier?", "Courier delivery costs KZT 1,200.", "my cart is 19,000 - how much more to get it free?"]
    ru: ["сколько стоит курьер?", "Курьерская доставка — 1 200 тенге.", "у меня корзина на 19 000, сколько добрать до бесплатной?"]
