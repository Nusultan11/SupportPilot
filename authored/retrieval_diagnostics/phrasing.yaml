  cable_cm:
    en: 'How many centimetres is the lead supplied with "{product}"?'
    ru: 'Какой протяжённости провод идёт в комплекте с «{product}»? Скажите в сантиметрах.'
    kk: '«{product}» жинағындағы сым неше сантиметрге жетеді? Жинақтағы сым туралы сұрап тұрмын.'
