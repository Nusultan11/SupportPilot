# Stage 3 qualitative review (hand-written; rendered into artifacts/reports/eda/report.md).
# Validated by supportpilot.data.review.Review. Record texts are not copied here.
schema_version: review/1
reviewer: Claude (claude-opus-5-5), LLM agent; not an independent human review
reviewed_at: '2026-11-11'
method: 'Per source: 100 uniformly random records and up to 100 records with a problem signal (seed 20261111,
  `supportpilot data eda` writes the samples to artifacts/reports/eda/review/). Every listed record was
  read in its cleaned form (text up to 170 chars, response up to 100 chars, dialogues: first 3 turns and
  the source target) and given one or more codes. `OK` means usable for the source''s intended purpose
  as is.'
codes:
  OK: usable as is
  LABEL_WRONG: (hard) source label does not match the text
  LABEL_AMBIGUOUS: (soft) text fits two labels or needs a taxonomy decision
  GARBLED: (hard) incoherent / token-soup text from a failed generation
  WEAK_TEXT: (hard as a standalone message) no actionable request in the text
  OFF_DOMAIN: (hard for store support) outside online-store customer support
  LANG_OTHER: (hard) not en/ru/kk, or heavily mixed with another language
  LID_ERROR: (hard) language detector chose the wrong language
  RESPONSE_DEFECT: (hard for responses) response refuses, misreads or invents context
  TRANSLATION_ISSUE: (soft) calque, typo or untranslated fragment in a translation
  PROFANITY_INSERTED: (soft) swear word inserted mechanically into a template
  UNNATURAL: (soft) phrasing or style a real customer/agent would not use
  RESPONSE_TEMPLATE: (soft) response keeps a placeholder or template instruction
  CONTEXT_DEPENDENT: (soft) meaning or decision depends on context outside the text
  PII_LIKE: (soft) realistic personal data (masked unless noted)
  DUPLICATE: (soft) exact duplicate, removed by dedup
  ARTIFACT: (soft) formatting artefact such as doubled CSV quotes
  LID_FALSE_ALARM: (none) low LID confidence, language is correct
hard_codes:
- LABEL_WRONG
- GARBLED
- WEAK_TEXT
- OFF_DOMAIN
- LANG_OTHER
- LID_ERROR
- RESPONSE_DEFECT
sources:
  belebele:
    summary: 'Professionally translated reading-comprehension items (FLORES passages) in kk/ru/en, 900
      per language, aligned by passage link and question number. Language labels are reliable: LID agrees
      on 2,699 of 2,700 questions and on all passages. The KK side has visible translation issues in about
      6 of 33 reviewed KK items (calques such as "консепт", typos, untranslated "190th"). Passages carry
      doubled CSV quotes from the source export. Not customer-support text.'
    verdict: Evaluation only, as registered. Reliable for LID calibration and KK/RU/EN language competence
      checks of candidate models.
    recommendation: Use in Stage 7 for zero-shot KK/RU competence (accuracy per language) and keep it
      as the LID calibration set. Never use for training or tuning.
