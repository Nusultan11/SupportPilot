  # ---------------------------------------------------------------- EN crowd-written assistant queries
  clinc150:
    domain: virtual_assistant
    origin: {en: human_written}
    evidence: >-
      Larson et al. 2019 (EMNLP, arXiv:1909.02027 §3): queries written by crowd workers from
      scenario and paraphrase prompts; no generator.
    labels:
      greeting: &clinc_greeting
        veto: [{pattern: '\b(?:alexa|siri|ai|robot|computer)\b', reason: "addressed to a voice assistant"}, *who_veto]
        intent: greeting
        min_words: 1
      thank_you: *clinc_greeting
      card_declined:
        veto:
          - {pattern: '\b(?:at|in) (?:the |a )?\w+|\b(?:food|groceries|gas|lunch|dinner|coffee|restaurant|hotel|subscription|macy|walgreens|starbucks|target|netflix|walmart|costco|amazon)', reason: "card declined at another merchant or place"}
        rules: [{cue: '\b(?:declin\w*|not (?:get )?accepted|denied|reject\w*|refused|didn''?t go through|did not go through)\b', intent: payment_problem}]
      order_status:
        veto: [{pattern: '\b(?:amazon|ebay|walmart|target|etsy|alibaba|nespresso|pizza|food|checks?)\b', reason: "order at another shop or of another kind"}]
        rules: [{cue: '\b(?:order\w*|package|parcel|purchase|shipment|deliver\w*|track\w*|arriv\w*)\b', intent: track_order}]
      # out-of-scope domains: travel, kitchen, auto, home, time, small talk, meta
      book_flight: &clinc_oos
        veto: [*shopping_veto]
        intent: out_of_scope
      book_hotel: *clinc_oos
      car_rental: *clinc_oos
      flight_status: *clinc_oos
      lost_luggage: *clinc_oos
      carry_on: *clinc_oos
