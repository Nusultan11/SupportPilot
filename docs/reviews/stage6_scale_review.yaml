  All 369 original chunk IDs retained; no original policy values replaced.
- 'Checked all supplied numeric minimum/maximum pairs for inversion: zero. Product IDs and explicit SKUs
  are unique. Technical fields count excludes names, identifiers, category and price.'
- Queries specify subject, requested predicate and conditions independently of ranking. Each required
  group resolves to canonical fact placements. Cross-language and mixed wording remain variants, never
  extra needs.
- All four unavailable attributes per product are absent from its specification. Certification identifiers,
  humidity and drop-test claims cannot be inferred from dimensions; diagnostic fee cannot establish replacement-part
  price.
- Archived policy intervals end before current policies start. Historical/current/comparison questions
  retain separate conditions; comparison explicitly enables all_versions. Twenty earlier-than-publication
  requests have no valid technical proof.
- Confirmed 100 multi-document requests ask separately for item mass and the parcel limit; they do not
  infer packed mass, stock or pickup availability.
findings:
- 222 distinct document IDs and 666 language versions include 200 explicit fictional products across 20
  domains, four document formats, 12-14 numeric attributes per profile and heterogeneous policy/procedure
  documents.
- 2600 explicit numeric subject/predicate facts are distinct canonical facts. Shared predicate names or
  equal values do not merge different products. Metadata/composite registry entries are not presented
  as additional atomic numeric facts.
- 3570 subject/predicate/condition needs are grouped into 119 correlated reasoning families before splitting.
  Counts establish controlled fact-target coverage, not 3570 independent human intents.
- The catalogue constitutes most of the volume. Template correlation, repeated generic attributes, uniform
  profile structure and only 50 manually authored non-profile needs restrict ecological diversity. Family-cluster
  confidence intervals and profile/non-profile slices are mandatory.
- RU/KK/EN drafts preserve explicit units, inequalities and dates structurally. Native fluency and exhaustive
  semantic translation agreement are not certified; no independent fluent human review occurred.
- Qrels are authored and non-exhaustive; recorded support establishes requested facts but unjudged alternative
  proof can remain. Semantic model leakage diagnostics are required separately before freeze.
limitations:
- LLM self-review is not independent annotation; no production readiness or complete semantic abstention
  claim.
- Diversity acceptance is for a controlled multilingual retrieval experiment. Natural customer phrasing,
  ambiguous conversations and conditional store policies remain a small part of the cohort.
- Final ranking holdout has not been evaluated or used to modify sources, thresholds or selection rules.
