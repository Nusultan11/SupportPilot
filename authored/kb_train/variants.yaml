# Training KB variants (Stage 4, ADR-025; DATA_CONTRACTS §5). Fictional stores whose policy
# values differ from each other and from the demo store (kb_sources/demo_store/facts.yaml),
# so a model trained on them has to read the context instead of memorising one policy.
# The `kb_variant_distinct` gate checks that no variant reuses a demo-store value of the
# facts listed in `distinct_facts`.
#
# Value conventions: money in KZT (integers), periods as integers or [min, max] ranges,
# times as "HH:MM". Each variant also has an `outdated` block: an earlier policy version
# (effective_to before the current effective_from) used for `conflicting_context` tasks.
# Authored by the Stage 4 agent (LLM); synthetic, no real store.
schema_version: kb_variants/1
distinct_facts:
  - return_window_days
  - refund_days
  - exchange_window_days
  - return_shipping_cost
  - courier_cost
  - free_delivery_from
  - pickup_cost
  - fast_delivery_days
  - region_delivery_days
  - instalment_months
  - cod_max
  - cancel_hours
  - min_order
  - warranty_months
  - defect_report_days
  - loyalty_percent
  - gift_card_months
  - account_delete_days
  - support_hours
  - support_phone
  - store_name

